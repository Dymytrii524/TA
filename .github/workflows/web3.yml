# Робочий конвеєр Web3 Sprint 0. Дзеркало — ci/web3.yml (правило R14 стежить за збігом).
# Без фільтрів paths, без секретів і без розгортання.
name: Web3 Sprint 0
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
defaults:
  run:
    shell: bash -euo pipefail {0}
    working-directory: web3-sprint-0
jobs:
  web3-tests:
    name: web3-sprint0-tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: web3_test
          POSTGRES_PASSWORD: local-ci-only
          POSTGRES_DB: ta_web3_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U web3_test -d ta_web3_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Pinned dependencies
        run: |
          npm ci --ignore-scripts
          npm audit --audit-level=moderate
          python -m pip install -r requirements.txt
      - name: Unit, fuzz, invariants and negative mutations
        env:
          FOUNDRY_PROFILE: ci
        run: |
          node tools/foundry.mjs forge test -vv
          python tools/mutations.py
      - name: SQL and API contracts
        run: |
          node tests/db.test.mjs
          node tests/db-p1.test.mjs
          node tests/db-p2.test.mjs
          node tests/wallet.test.mjs
          node tests/review.test.mjs
          node tests/finality.test.mjs
          python tools/check_api.py
          node tests/amoy-config.test.mjs
      - name: PostgreSQL multi-session finalization
        env:
          WEB3_TEST_DATABASE_URL: postgres://web3_test:local-ci-only@127.0.0.1:5432/ta_web3_test
        run: node tests/finality.test.mjs
      - name: Local EVM integration
        run: |
          node tools/foundry.mjs anvil --host 127.0.0.1 --port 8545 --chain-id 31337 --silent &
          anvil_pid=$!
          trap 'kill "$anvil_pid" || true' EXIT
          node tools/wait_rpc.mjs
          node tests/integration.test.mjs
          node tests/wallet-integration.test.mjs
          node tests/subsets.test.mjs
          node tests/http-errors.test.mjs
          node tests/wallet-id.test.mjs
          node tools/r21_mutations.mjs
          WEB3_TEST_DATABASE_URL=postgres://web3_test:local-ci-only@127.0.0.1:5432/ta_web3_test node tests/subsets.test.mjs
      - name: Disposable PostgreSQL backup and restore
        env:
          PG_SERVICE_CONTAINER: ${{ job.services.postgres.id }}
        run: bash tests/backup-restore-ci.sh
      - name: R21-04 causal mapping and historical V1 regressions
        env:
          ANVIL_URL: http://127.0.0.1:8546
        run: |
          node tools/foundry.mjs anvil --host 127.0.0.1 --port 8546 --chain-id 31337 --timestamp $(($(date +%s)-600)) --silent &
          anvil_pid=$!
          trap 'kill "$anvil_pid" || true' EXIT
          node tools/wait_rpc.mjs
          node tests/mapping-evidence.test.mjs
          WEB3_TEST_DATABASE_URL=postgres://web3_test:local-ci-only@127.0.0.1:5432/ta_web3_test node tests/mapping-evidence.test.mjs
  blockchain-gate:
    name: blockchain-gate
    needs: [web3-tests]
    if: always()
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - name: Fail closed including skipped or cancelled tests
        run: |
          result="${{ needs.web3-tests.result }}"
          echo "job web3-tests: $result"
          test "$result" = success

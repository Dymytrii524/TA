<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Trans-Atlas - mizhnarodna birzha vantazhoperevezen: poshuk vantazhiv i transportu, rynok tekhniky, novyny, bagatomovnyi interfeis (UA/EN/PL/DE).">
<title>Trans-Atlas</title>
<style>
  :root{
    --paper:#FFFFFF; --paper-2:#F1F4F8; --surface:#FFFFFF;
    --ink:#1B2733; --ink-soft:#5B6B7A; --line:#D6DEE6;
    --accent:#1B5FA8; --accent-ink:#FFFFFF; --accent-2:#123F70;
    --success:#2E7D5B; --warning:#B4791D; --danger:#B23B2E;
    --mode-auto:#1B5FA8; --mode-rail:#B4791D; --mode-sea:#0E7C86; --mode-air:#B23B2E; --mode-drone:#3F7D4A; --mode-multi:#6A4C93;
    --mode-auto-dk:#0E3E6B; --mode-rail-dk:#7A4E10; --mode-sea-dk:#074850; --mode-air-dk:#6E2018; --mode-drone-dk:#1F4A28; --mode-multi-dk:#3E2A5C;
    --shadow:rgba(20,33,50,.12);
    --font-display:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --font-body:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --font-mono:ui-monospace,"Cascadia Mono","SFMono-Regular",Consolas,monospace;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper:#0E1620; --paper-2:#141F2C; --surface:#121C27;
      --ink:#E6EBF0; --ink-soft:#93A3B2; --line:#25333F;
      --accent:#5B9BDB; --accent-ink:#0E1620; --accent-2:#8FC0EE;
      --success:#4FAE85; --warning:#D3A551; --danger:#E17862;
      --mode-auto:#5B9BDB; --mode-rail:#D3A551; --mode-sea:#4FB8C4; --mode-air:#E17862; --mode-drone:#6FBF8D; --mode-multi:#B79AE0;
      --shadow:rgba(0,0,0,.4);
    }
  }
  :root[data-theme="dark"]{
    --paper:#0E1620; --paper-2:#141F2C; --surface:#121C27;
    --ink:#E6EBF0; --ink-soft:#93A3B2; --line:#25333F;
    --accent:#5B9BDB; --accent-ink:#0E1620; --accent-2:#8FC0EE;
    --success:#4FAE85; --warning:#D3A551; --danger:#E17862;
    --mode-auto:#5B9BDB; --mode-rail:#D3A551; --mode-sea:#4FB8C4; --mode-air:#E17862; --mode-multi:#B79AE0;
    --shadow:rgba(0,0,0,.4);
  }

  *{box-sizing:border-box;}
  html{color-scheme:light dark;}
  body{
    margin:0; background:var(--paper); color:var(--ink);
    font-family:var(--font-body); line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,h4{font-family:var(--font-display); text-wrap:balance; margin:0 0 .4em; letter-spacing:0; font-weight:700;}
  p{margin:0 0 1em; max-width:64ch;}
  a{color:var(--accent);}
  button{font-family:inherit;}
  ::selection{background:var(--accent); color:var(--accent-ink);}
  :focus-visible{outline:2px solid var(--accent); outline-offset:2px;}
  .num{font-variant-numeric:tabular-nums; font-family:var(--font-mono);}
  .wrap{max-width:1180px; margin:0 auto; padding:0 20px;}
  .eyebrow{font-family:var(--font-mono); text-transform:uppercase; letter-spacing:.12em; font-size:.72rem; color:var(--ink-soft);}
  .btn{
    display:inline-flex; align-items:center; gap:8px; border:1px solid var(--line);
    background:var(--surface); color:var(--ink); padding:.6em 1.1em; border-radius:2px;
    font-weight:600; font-size:.92rem; cursor:pointer; transition:background-color .15s, border-color .15s;
  }
  .btn:hover{border-color:var(--accent);}
  .btn:active{transform:translateY(1px);}
  .btn-primary{background:var(--accent); color:var(--accent-ink); border-color:var(--accent);}
  .btn-primary:hover{background:var(--accent-2); border-color:var(--accent-2);}
  .btn-ghost{background:transparent; border-color:transparent; color:var(--ink-soft);}
  .btn-ghost:hover{color:var(--ink); border-color:var(--line);}
  .btn-sm{padding:.4em .8em; font-size:.82rem;}
  .btn[disabled]{opacity:.5; cursor:not-allowed;}
  .linklike{background:none; border:none; color:var(--accent); font-weight:600; font-size:.85rem; cursor:pointer; padding:0; text-decoration:none; display:inline-block;}
  .linklike:hover{text-decoration:underline;}
  input,select,textarea{
    font-family:inherit; font-size:.94rem; padding:.6em .75em; border:1px solid var(--line);
    border-radius:2px; background:var(--surface); color:var(--ink); width:100%;
  }
  input:focus,select:focus,textarea:focus{border-color:var(--accent);}
  label{display:block; font-size:.78rem; font-family:var(--font-mono); text-transform:uppercase; letter-spacing:.06em; color:var(--ink-soft); margin-bottom:.35em;}
  .field-err{color:var(--danger); font-size:.78rem; margin-top:.3em; display:none;}
  .field.invalid input,.field.invalid select,.field.invalid textarea{border-color:var(--danger);}
  .field.invalid .field-err{display:block;}
  svg.icon{width:1.15em; height:1.15em; stroke:currentColor; fill:none; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round; flex:none;}

  /* header */
  .topline{height:10px; background:#F3C892;}
  header.site{background:var(--paper); border-bottom:1px solid var(--line);}
  .utilitybar{background:var(--accent-2);}
  .utility-row{display:flex; justify-content:flex-end; align-items:center; gap:10px; padding:8px 20px; max-width:1180px; margin:0 auto;}
  .util-btn{border:none; background:rgba(255,255,255,.16); color:#fff; padding:.55em 1.1em; font-weight:600; font-size:.82rem; cursor:pointer; border-radius:2px;}
  .util-btn:hover{background:rgba(255,255,255,.26);}
  .util-btn.primary{background:#fff; color:var(--accent-2);}
  .util-btn.primary:hover{background:#EAF1F8;}
  .auth-inline{display:flex; align-items:center; gap:8px;}
  .user-chip{display:flex; align-items:center; gap:8px; font-size:.82rem; font-weight:600; color:#fff;}
  .user-chip .avatar{width:22px; height:22px; border-radius:50%; background:#fff; color:var(--accent-2); display:flex; align-items:center; justify-content:center; font-size:.68rem; font-weight:700;}
  .logorow{padding:18px 20px;}
  .logorow-inner{max-width:1180px; margin:0 auto; display:flex; align-items:center; justify-content:center; position:relative;}
  .logo{display:flex; flex-direction:column; align-items:center; gap:2px; cursor:pointer; border:none; background:none; color:inherit; text-align:center; padding:0;}
  .logo .wordmark{font-family:var(--font-display); font-weight:700; font-size:1.9rem; letter-spacing:.02em;}
  .logo .wordmark b{color:var(--accent); font-weight:700;}
  .logo .tagline{font-family:var(--font-mono); font-size:.66rem; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-soft);}
  /* Language switcher: a hover/focus dropdown (same pattern as the "Сервіси"
     nav item below) rather than a flat button row - a row of 33 buttons
     doesn't fit the header once the full language roadmap goes live. */
  .lang-box{position:absolute; right:0; top:50%; transform:translateY(-50%);}
  .lang-toggle{display:flex; align-items:center; gap:6px; border:1px solid var(--line); border-radius:2px; background:var(--surface); color:var(--ink-soft); padding:.4em .6em; font-size:.72rem; font-family:var(--font-mono); font-weight:700; cursor:pointer;}
  .lang-toggle:hover{color:var(--ink);}
  .lang-toggle svg.icon{width:.85em; height:.85em;}
  .lang-menu{
    position:absolute; top:100%; right:0; margin-top:4px; z-index:40; min-width:190px; max-height:340px; overflow-y:auto;
    background:var(--surface); border:1px solid var(--line); box-shadow:0 10px 24px var(--shadow);
    display:none; flex-direction:column; padding:4px 0;
  }
  .lang-box:hover .lang-menu, .lang-box:focus-within .lang-menu{display:flex;}
  .lang-menu button{display:flex; align-items:center; gap:8px; border:none; background:none; width:100%; text-align:left; color:var(--ink-soft); padding:.45em .7em; font-size:.76rem; font-family:var(--font-mono); font-weight:700; cursor:pointer;}
  .lang-menu button:hover{background:var(--paper-2); color:var(--ink);}
  .lang-menu button.active{color:var(--accent); background:var(--paper-2);}
  .flag-dot{width:13px; height:13px; border-radius:50%; flex:none; box-shadow:inset 0 0 0 1px rgba(0,0,0,.15);}
  .flag-dot.uk{background:linear-gradient(to bottom,#005BBB 50%,#FFD500 50%);}
  .flag-dot.en{background:linear-gradient(135deg,#00247D 34%,#fff 34% 67%,#CF142B 67%);}
  .flag-dot.pl{background:linear-gradient(to bottom,#fff 50%,#DC143C 50%);}
  .flag-dot.de{background:linear-gradient(to bottom,#000 33%,#DD0000 33% 67%,#FFCE00 67%);}
  .flag-dot.ro{background:linear-gradient(to right,#002B7F 33%,#FCD116 33% 67%,#CE1126 67%);}
  .flag-dot.cs{background:linear-gradient(135deg,#11457E 30%,#fff 30% 65%,#D7141A 65%);}
  .flag-dot.sk{background:linear-gradient(to bottom,#fff 33%,#0B4EA2 33% 67%,#EE1C25 67%);}
  .flag-dot.hu{background:linear-gradient(to bottom,#CD2A3E 33%,#fff 33% 67%,#436F4D 67%);}
  .flag-dot.bg{background:linear-gradient(to bottom,#fff 33%,#00966E 33% 67%,#D62612 67%);}
  .flag-dot.lt{background:linear-gradient(to bottom,#FDB913 33%,#006A44 33% 67%,#C1272D 67%);}
  .flag-dot.lv{background:linear-gradient(to bottom,#9E3039 40%,#fff 40% 60%,#9E3039 60%);}
  .flag-dot.et{background:linear-gradient(to bottom,#0072CE 33%,#000 33% 67%,#fff 67%);}
  .flag-dot.sl{background:linear-gradient(to bottom,#fff 33%,#005CE7 33% 67%,#ED1C24 67%);}
  .flag-dot.hr{background:linear-gradient(to bottom,#FF0000 33%,#fff 33% 67%,#0000FF 67%);}
  .flag-dot.sr{background:linear-gradient(to bottom,#C6363C 33%,#0C4076 33% 67%,#fff 67%);}
  .flag-dot.fr{background:linear-gradient(to right,#0055A4 33%,#fff 33% 67%,#EF4135 67%);}
  .flag-dot.es{background:linear-gradient(to bottom,#AA151B 25%,#F1BF00 25% 75%,#AA151B 75%);}
  .flag-dot.it{background:linear-gradient(to right,#008C45 33%,#fff 33% 67%,#CD212A 67%);}
  .flag-dot.nl{background:linear-gradient(to bottom,#AE1C28 33%,#fff 33% 67%,#21468B 67%);}
  .flag-dot.pt{background:linear-gradient(to right,#046A38 40%,#DA291C 40%);}
  .flag-dot.tr{background:#E30A17;}
  .flag-dot.el{background:linear-gradient(to bottom,#0D5EAF 25%,#fff 25% 50%,#0D5EAF 50% 75%,#fff 75%);}
  .flag-dot.sv{background:#006AA7;}
  .flag-dot.da{background:#C60C30;}
  .flag-dot.nb{background:#EF2B2D;}
  .flag-dot.fi{background:linear-gradient(to right,#fff 40%,#003580 40% 55%,#fff 55%);}
  .flag-dot.zh{background:#DE2910;}
  .flag-dot.ar{background:linear-gradient(to bottom,#000 25%,#fff 25% 50%,#007A3D 50% 75%,#CE1126 75%);}
  .flag-dot.ka{background:#fff;}
  .flag-dot.az{background:linear-gradient(to bottom,#00B9E4 33%,#E4312B 33% 67%,#00AF66 67%);}
  .flag-dot.kk{background:#00AFCA;}
  .flag-dot.uz{background:linear-gradient(to bottom,#0099B5 33%,#fff 33% 67%,#1EB53A 67%);}
  .flag-dot.hy{background:linear-gradient(to bottom,#D90012 33%,#0033A0 33% 67%,#F2A800 67%);}
  .navbar{background:var(--ink); position:relative;}
  .navbar .wrap{display:flex; align-items:center; max-width:1180px; margin:0 auto; padding:0 20px;}
  nav.primary{display:flex; gap:2px; flex:1; flex-wrap:wrap;}
  nav.primary a{
    font-size:.88rem; font-weight:600; color:rgba(255,255,255,.8); text-decoration:none;
    padding:12px 14px; white-space:nowrap; border-bottom:2px solid transparent;
  }
  nav.primary a:hover{color:#fff; background:rgba(255,255,255,.07);}
  nav.primary a.active{color:#fff; border-bottom-color:var(--accent);}
  .burger{display:none; border:1px solid rgba(255,255,255,.3); background:transparent; color:#fff; border-radius:2px; padding:.4em .6em; cursor:pointer;}
  /* "Сервіси" nav item: a category label with a dropdown, not a page of its
     own - same idea as a real site's Инфоцентр/Пресс-центр menus. Pure CSS
     hover/focus-within, no JS: cheap and correct for a mouse-driven desktop
     nav, and the mobile media query below flattens it into the vertical
     burger menu instead (a dropdown-inside-a-dropdown is bad UX on touch). */
  .navlink-dropdown{position:relative;}
  .navlink-dropdown-toggle{
    display:flex; align-items:center; gap:4px; border:none; background:none; font-family:inherit;
    font-size:.88rem; font-weight:600; color:rgba(255,255,255,.8); cursor:pointer;
    padding:12px 14px; white-space:nowrap; border-bottom:2px solid transparent;
  }
  .navlink-dropdown-toggle:hover{color:#fff; background:rgba(255,255,255,.07);}
  .navlink-dropdown-toggle.active{color:#fff; border-bottom-color:var(--accent);}
  .navlink-dropdown-toggle svg.icon{width:.9em; height:.9em;}
  .navlink-dropdown-menu{
    position:absolute; top:100%; left:0; min-width:230px; z-index:40; padding:4px 0;
    background:var(--surface); border:1px solid var(--line); box-shadow:0 10px 24px var(--shadow);
    display:none; flex-direction:column;
  }
  .navlink-dropdown:hover .navlink-dropdown-menu, .navlink-dropdown:focus-within .navlink-dropdown-menu{display:flex;}
  .navlink-dropdown-menu a{display:flex; align-items:center; gap:10px; padding:10px 14px; color:var(--ink); text-decoration:none; font-size:.86rem; font-weight:600;}
  .navlink-dropdown-menu a:hover{background:var(--paper-2); color:var(--accent);}
  .navlink-dropdown-menu svg.icon{color:var(--accent); width:1.15em; height:1.15em;}
  @media (max-width:980px){
    nav.primary{display:none; position:absolute; top:100%; left:0; right:0; background:var(--ink); flex-direction:column; padding:8px; box-shadow:0 4px 10px var(--shadow); z-index:30;}
    nav.primary.open{display:flex;}
    nav.primary a{border-bottom:none; border-left:2px solid transparent;}
    nav.primary a.active{border-left-color:var(--accent); border-bottom-color:transparent;}
    .burger{display:inline-flex;}
    .logo .wordmark{font-size:1.4rem;}
    .lang-box{position:static; transform:none; margin-top:10px;}
    .logorow-inner{flex-direction:column;}
    .navlink-dropdown{position:static;}
    .navlink-dropdown-toggle{width:100%; border-left:2px solid transparent;}
    .navlink-dropdown-toggle.active{border-left-color:var(--accent); border-bottom-color:transparent;}
    .navlink-dropdown-menu{position:static; display:flex; background:transparent; border:none; box-shadow:none; padding-left:14px;}
    .navlink-dropdown-menu a{color:rgba(255,255,255,.8); padding:10px 14px;}
    .navlink-dropdown-menu a:hover{color:#fff; background:rgba(255,255,255,.07);}
    .navlink-dropdown-menu svg.icon{color:inherit;}
  }

  /* home: lede + banner + dashboard */
  .home-lede{padding:22px 0 0;}
  .home-lede h1{font-size:1.5rem; max-width:none;}
  .home-lede .lede{max-width:60ch; margin-bottom:0;}

  /* All 6 tiles render at equal width (flex-basis 0, equal flex-grow) so
     they're always the same size at rest, on any tile count. Hovering one
     sets its flex-grow to 2.5 against the rest's 1 each: with 6 items that
     resolves to exactly 2x the resting width for the hovered tile, and the
     other 5 sharing the remainder equally (a uniform ~0.8x shrink) - the
     row's total width never changes, only how it's divided. flex-grow/flex
     transitions smoothly in evergreen browsers, no JS needed. Falls back to
     a plain 2-col grid (no hover effect) under 900px, where the effect
     wouldn't have room to read anyway and hover isn't a touch gesture.  */
  .banner-row{display:flex; gap:2px; background:var(--line); margin-top:18px;}
  @media (max-width:900px){.banner-row{display:grid; grid-template-columns:1fr 1fr;}}
  .banner-panel{position:relative; flex:1 1 0%; min-width:0; min-height:210px; display:flex; align-items:flex-end; justify-content:center; padding-bottom:14px; border:none; text-align:left; color:#fff; cursor:pointer; overflow:hidden; background-size:cover; background-position:center; background-repeat:no-repeat; transition:flex .4s cubic-bezier(.4,0,.2,1), filter .2s;}
  .banner-panel.mode-auto{background-color:var(--mode-auto); background-image:linear-gradient(180deg, rgba(10,18,28,.1), rgba(8,14,20,.6)), url('images/banner-auto.jpg');}
  .banner-panel.mode-rail{background-color:var(--mode-rail); background-image:linear-gradient(180deg, rgba(10,18,28,.1), rgba(8,14,20,.6)), url('images/banner-rail.jpg');}
  .banner-panel.mode-sea{background-color:var(--mode-sea); background-image:linear-gradient(180deg, rgba(10,18,28,.1), rgba(8,14,20,.6)), url('images/banner-sea.jpg');}
  .banner-panel.mode-air{background-color:var(--mode-air); background-image:linear-gradient(180deg, rgba(10,18,28,.1), rgba(8,14,20,.6)), url('images/banner-air.jpg');}
  .banner-panel.mode-drone{background-color:var(--mode-drone); background-image:linear-gradient(180deg, rgba(10,18,28,.1), rgba(8,14,20,.6)), url('images/banner-drone.jpg');}
  .banner-panel.mode-multi{background-color:var(--mode-multi); background-image:linear-gradient(180deg, rgba(10,18,28,.1), rgba(8,14,20,.6)), url('images/banner-multi.jpg');}
  .banner-panel:hover{flex-grow:2.5; filter:brightness(1.07); z-index:1;}
  .banner-panel .bp-badge{position:absolute; left:14px; top:14px; width:2.4em; height:2.4em; border-radius:50%; background:rgba(255,255,255,.92); display:flex; align-items:center; justify-content:center; color:var(--accent-2); box-shadow:0 2px 6px rgba(0,0,0,.25);}
  .banner-panel .bp-badge svg.icon{width:1.2em; height:1.2em;}
  .banner-panel .bp-label{position:relative; color:#fff; font-weight:700; font-size:.85rem; text-align:center; text-shadow:0 1px 4px rgba(0,0,0,.55); white-space:nowrap;}

  .dash-grid{display:grid; grid-template-columns:150px 1fr 130px; gap:16px; margin:24px 0 40px;}
  @media (max-width:1080px){.dash-grid{grid-template-columns:1fr 1fr;}}
  @media (max-width:760px){.dash-grid{grid-template-columns:1fr;}}
  .dash-stack{display:flex; flex-direction:column; gap:12px;}
  .dash-col{border:1px solid var(--line); background:var(--surface); align-self:start;}
  .panel-head{background:var(--accent-2); color:#fff; padding:12px 16px; font-weight:700; font-size:.82rem; display:flex; align-items:center; gap:10px; text-transform:uppercase; letter-spacing:.03em;}
  .panel-head svg.icon{width:1.2em; height:1.2em;}
  .panel-body{padding:16px;}
  .panel-body.flush{padding:0;}
  .panel-more{padding:12px 16px; border-top:1px solid var(--line);}
  /* Halved side columns (search forms + services) - see the "зменши на
     половину" request: narrower fixed columns free up width for the
     Міжнародні/Внутрішні flow tables now occupying the middle column.
     Everything inside scales down to stay usable at ~130-150px. */
  .dash-col.compact .panel-head{padding:9px 10px; font-size:.7rem; gap:6px;}
  .dash-col.compact .panel-head svg.icon{width:1em; height:1em;}
  .dash-col.compact .panel-body{padding:10px;}
  .dash-col.compact label{font-size:.64rem;}
  .dash-col.compact input, .dash-col.compact select{padding:.4em .5em; font-size:.78rem;}
  .dash-col.compact .console-grid{grid-template-columns:1fr; gap:8px;}
  .dash-col.compact .btn{padding:.5em .6em; font-size:.78rem;}
  .dash-col.compact .services-item{padding:8px 10px; font-size:.74rem; gap:8px;}
  .dash-col.compact .services-item svg.icon{width:1.05em; height:1.05em;}
  .dash-col.compact .market-grid{grid-template-columns:repeat(2,1fr);}
  .dash-col.compact .market-card{display:flex; flex-direction:column; align-items:center; padding:10px 4px; gap:4px; text-align:center; text-decoration:none;}
  .dash-col.compact .market-card svg.icon{width:1.3em; height:1.3em; color:var(--accent); margin:0 auto;}
  .dash-col.compact .market-card .mk-title{font-size:.66rem; line-height:1.2; font-weight:700;}

  .mode-tabs{display:flex; gap:0; margin-bottom:16px; border:1px solid var(--line); border-radius:2px; overflow:hidden;}
  .mode-tabs button{flex:1; display:flex; align-items:center; justify-content:center; gap:6px; border:none; border-right:1px solid var(--line); background:var(--paper-2); color:var(--ink-soft); padding:.65em .5em; font-weight:700; font-size:.82rem; cursor:pointer;}
  .mode-tabs button:last-child{border-right:none;}
  .mode-tabs button svg.icon{width:1.1em; height:1.1em;}
  .mode-tabs button.active{background:var(--accent); color:var(--accent-ink);}
  .console-grid{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
  .console-grid .span2{grid-column:1/-1;}

  .mode-sub-panel{display:none; flex-wrap:wrap; gap:6px; margin-top:8px;}
  .mode-sub-item{display:flex; align-items:center; gap:6px; border:1px solid var(--line); border-radius:2px; padding:.4em .6em; font-size:.78rem; font-weight:600; color:var(--ink-soft); cursor:pointer; width:auto;}
  .mode-sub-item input{width:auto; padding:0; margin:0; accent-color:var(--accent);}
  .mode-sub-item svg.icon{width:1em; height:1em;}
  .mode-sub-item:has(input:checked){border-color:var(--accent); background:var(--paper-2); color:var(--accent);}


  .services-list{display:flex; flex-direction:column;}
  .services-item{display:flex; align-items:center; gap:12px; padding:12px 16px; border-bottom:1px solid var(--line); color:var(--ink); text-decoration:none; font-size:.86rem; font-weight:600;}
  .services-item:last-child{border-bottom:none;}
  .services-item:hover{background:var(--paper-2); color:var(--accent);}
  .services-item svg.icon{color:var(--accent); width:1.25em; height:1.25em;}

  /* weather page */
  .weather-grid{display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-top:20px;}
  @media (max-width:760px){.weather-grid{grid-template-columns:1fr;}}
  .weather-card{border:1px solid var(--line); background:var(--surface); padding:18px;}
  .weather-card.warn-card{border-color:var(--danger);}
  .weather-card h3{font-size:1rem; margin:0 0 12px;}
  .weather-stale-badge{font-family:var(--font-mono); font-size:.66rem; text-transform:uppercase; color:var(--warning); border:1px solid var(--warning); padding:.1em .4em;}
  .weather-current{display:flex; align-items:baseline; gap:10px; flex-wrap:wrap; margin-bottom:14px;}
  .wc-temp{font-size:1.8rem; font-weight:700; color:var(--accent);}
  .wc-cond{font-size:.9rem; color:var(--ink-soft);}
  .wc-sub{flex-basis:100%; font-size:.76rem; color:var(--ink-soft);}
  .weather-risk{margin-bottom:14px;}
  .weather-risk-list{list-style:none; margin:8px 0 0; padding:0; display:flex; flex-direction:column; gap:6px;}
  .weather-risk-list li{display:flex; align-items:center; gap:8px; font-size:.84rem; color:var(--danger);}
  .weather-risk-list li.color-yellow{color:var(--warning);}
  .weather-alerts{margin-bottom:14px;}
  .weather-risk-list li svg.icon{width:1em; height:1em;}
  .weather-msg.good{color:var(--success); margin:8px 0 0; font-size:.84rem;}
  .weather-forecast{margin-bottom:14px;}
  .weather-hours{display:flex; gap:2px; overflow-x:auto; margin-top:8px; padding-bottom:4px;}
  .weather-hour{flex:none; width:64px; text-align:center; border:1px solid var(--line); padding:8px 4px; font-size:.7rem; color:var(--ink-soft);}
  .weather-hour .wh-time{display:block; font-family:var(--font-mono);}
  .weather-hour .wh-temp{display:block; font-size:.95rem; font-weight:700; color:var(--ink); margin:4px 0;}
  .weather-provenance{font-size:.72rem; color:var(--ink-soft); border-top:1px solid var(--line); padding-top:10px;}
  .weather-provenance a{color:var(--ink-soft);}
  .weather-msg{color:var(--ink-soft); font-size:.9rem; margin-top:16px;}

  /* directory page */
  .directory-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:14px; margin-top:20px;}
  .directory-card{border:1px solid var(--line); background:var(--surface); padding:16px; display:flex; flex-direction:column; gap:8px;}
  .directory-card-head{display:flex; align-items:center; gap:10px;}
  .country-flag{width:20px; height:14px; flex:none; box-shadow:inset 0 0 0 1px rgba(0,0,0,.15);}
  .country-flag.ua{background:linear-gradient(to bottom,#005BBB 50%,#FFD500 50%);}
  .country-flag.pl{background:linear-gradient(to bottom,#fff 50%,#DC143C 50%);}
  .country-flag.md{background:linear-gradient(90deg,#003DA5 33%,#FFD200 33% 67%,#C8102E 67%);}
  .country-flag.ro{background:linear-gradient(90deg,#002B7F 33%,#FCD116 33% 67%,#CE1126 67%);}
  .country-flag.ee{background:linear-gradient(to bottom,#0072CE 33%,#000 33% 67%,#fff 67%);}
  .country-flag.kz{background:#00AFCA;}
  .country-flag.us{background:linear-gradient(180deg,#B22234 0 15%,#fff 15% 30%,#B22234 30% 45%,#fff 45% 60%,#3C3B6E 60% 100%);}
  .country-flag.ch{background:#D52B1E;}
  .country-flag.de{background:linear-gradient(to bottom,#000 33%,#DD0000 33% 67%,#FFCE00 67%);}
  .country-flag.lt{background:linear-gradient(to bottom,#FDB913 33%,#006A44 33% 67%,#C1272D 67%);}
  .country-flag.cz{background:linear-gradient(to bottom,#fff 50%,#D7141A 50%);}
  .country-flag.at{background:linear-gradient(to bottom,#ED2939 33%,#fff 33% 67%,#ED2939 67%);}
  .country-flag.nl{background:linear-gradient(to bottom,#AE1C28 33%,#fff 33% 67%,#21468B 67%);}
  .country-flag.tr{background:#E30A17;}
  .directory-card-head h3{margin:0; font-size:.92rem; line-height:1.3;}
  .directory-badge{align-self:flex-start; font-size:.68rem; font-family:var(--font-mono); text-transform:uppercase; letter-spacing:.03em; padding:.2em .5em; border:1px solid var(--line); color:var(--ink-soft);}
  .directory-badge.official{color:var(--success); border-color:var(--success);}
  .directory-desc{font-size:.84rem; color:var(--ink-soft); margin:0; flex:1;}
  .directory-card a.linklike{margin-top:4px;}

  /* borders page */
  .status-pill{display:inline-flex; align-items:center; gap:6px; font-size:.74rem; font-weight:700; padding:.25em .6em; border-radius:2px; white-space:nowrap;}
  .status-pill::before{content:""; width:8px; height:8px; border-radius:50%; background:currentColor;}
  .status-pill.green{color:var(--success); background:color-mix(in srgb, var(--success) 14%, transparent);}
  .status-pill.yellow{color:var(--warning); background:color-mix(in srgb, var(--warning) 14%, transparent);}
  .status-pill.red{color:var(--danger); background:color-mix(in srgb, var(--danger) 14%, transparent);}
  .status-pill.unknown{color:var(--ink-soft); background:var(--paper-2);}
  .border-table{border:1px solid var(--line); background:var(--surface);}
  .border-row{display:grid; grid-template-columns:1.6fr auto auto 1.4fr; gap:16px; align-items:center; padding:12px 16px; border-bottom:1px solid var(--line);}
  .border-row:last-child{border-bottom:none;}
  .border-row:hover{background:var(--paper-2);}
  .border-row .br-name{font-weight:700; font-size:.9rem;}
  .border-row .br-sub{font-size:.76rem; color:var(--ink-soft); margin-top:2px;}
  .border-row .br-queue{font-family:var(--font-mono); font-size:.82rem; text-align:right;}
  @media (max-width:820px){
    .border-row{grid-template-columns:1fr; gap:6px; text-align:left;}
    .border-row .br-queue{text-align:left;}
  }
  .borders-source-note{font-size:.7rem; color:var(--ink-soft); margin-top:2px;}

  /* home: country flow tables (international / domestic), styled after
     trans-atlas.net's own homepage tables - continent tabs, dense
     two-column country grid, per-country Транс/Грузы export-import rows. */
  .flows-grid{display:grid; grid-template-columns:1fr 1fr; gap:16px; align-self:start;}
  @media (max-width:900px){.flows-grid{grid-template-columns:1fr;}}
  .flow-panel{border:1px solid var(--line); background:var(--surface);}
  .flow-tabs{display:flex; gap:6px; flex-wrap:wrap; padding:10px 12px; border-bottom:1px solid var(--line);}
  .flow-tabs button{border:1px solid var(--line); background:var(--paper-2); color:var(--ink-soft); font-size:.72rem; font-weight:700; padding:.3em .8em; border-radius:20px; cursor:pointer;}
  .flow-tabs button.active{background:var(--accent-2); color:#fff; border-color:var(--accent-2);}
  .flow-country-grid{display:grid; grid-template-columns:1fr 1fr;}
  @media (max-width:520px){.flow-country-grid{grid-template-columns:1fr;}}
  .flow-country{display:flex; align-items:flex-start; gap:8px; padding:7px 12px; border-bottom:1px solid var(--line); font-size:.76rem;}
  .flow-country:nth-child(odd){border-right:1px solid var(--line);}
  .flow-country-head{display:flex; flex-direction:column; align-items:center; gap:3px; min-width:52px; font-weight:900; font-family:var(--font-mono); font-size:.82rem;}
  .flow-country-head .country-flag{width:40px; height:28px;}
  .flow-country-rows{flex:1; display:flex; flex-direction:column; gap:2px; min-width:0;}
  .flow-subrow{display:flex; align-items:center; gap:6px;}
  .flow-subrow .flow-kind{color:var(--ink-soft); flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-weight:700;}
  .flow-num{display:inline-flex; align-items:center; gap:1px; font-family:var(--font-mono); font-weight:900; min-width:1.6em; border:none; background:none; padding:0; cursor:pointer; color:inherit; -webkit-tap-highlight-color:transparent;}
  .flow-num:hover{text-decoration:underline;}
  .flow-num:focus-visible{outline:2px solid var(--accent-2); outline-offset:2px;}
  .flow-num svg.icon{width:.8em; height:.8em; stroke-width:3.2;}
  .flow-num.export{color:var(--accent);}
  .flow-num.import{color:var(--warning);}

  /* Q&A page */
  .qa-grid{display:grid; grid-template-columns:1fr 1.25fr; gap:18px; margin-top:20px; align-items:start;}
  @media (max-width:900px){.qa-grid{grid-template-columns:1fr;}}
  .qa-col{border:1px solid var(--line); background:var(--surface); display:flex; flex-direction:column; max-height:640px;}
  .qa-col-head{padding:14px 16px; border-bottom:1px solid var(--line); font-weight:700; font-size:.86rem; display:flex; align-items:center; gap:8px;}
  .qa-col-body{padding:14px 16px; overflow-y:auto; flex:1;}
  .qa-wiki-cats{display:flex; flex-wrap:wrap; gap:6px; margin-bottom:10px;}
  .qa-wiki-cats button{border:1px solid var(--line); background:var(--paper-2); color:var(--ink-soft); font-size:.72rem; font-weight:700; padding:.35em .7em; border-radius:20px; cursor:pointer;}
  .qa-wiki-cats button.active{background:var(--accent); color:var(--accent-ink); border-color:var(--accent);}
  .qa-wiki-search{width:100%; margin-bottom:12px;}
  .qa-wiki-item{border:1px solid var(--line); margin-bottom:8px;}
  .qa-wiki-item-head{display:flex; justify-content:space-between; align-items:center; gap:8px; padding:10px 12px; cursor:pointer; font-size:.84rem; font-weight:700;}
  .qa-wiki-item-head:hover{background:var(--paper-2);}
  .qa-wiki-item-cat{font-size:.66rem; font-weight:700; text-transform:uppercase; color:var(--accent); font-family:var(--font-mono);}
  .qa-wiki-item-body{padding:0 12px 12px; font-size:.82rem; color:var(--ink-soft); white-space:pre-line; line-height:1.55;}
  .qa-wiki-item-sources{font-size:.7rem; color:var(--ink-soft); margin-top:8px; border-top:1px solid var(--line); padding-top:8px;}
  .qa-chat-messages{display:flex; flex-direction:column; gap:12px;}
  .qa-msg{max-width:92%; padding:10px 14px; border:1px solid var(--line); font-size:.86rem; line-height:1.5; white-space:pre-line;}
  .qa-msg.user{align-self:flex-end; background:var(--accent); color:var(--accent-ink); border-color:var(--accent);}
  .qa-msg.assistant{align-self:flex-start; background:var(--paper-2);}
  .qa-msg.assistant.warn{border-color:var(--warning);}
  .qa-msg-sources{margin-top:8px; padding-top:8px; border-top:1px solid var(--line); font-size:.72rem; display:flex; flex-wrap:wrap; gap:6px; align-items:center;}
  .qa-source-pill{border:1px solid var(--line); border-radius:20px; padding:.15em .6em; font-family:var(--font-mono); background:var(--surface);}
  .qa-confidence{font-size:.68rem; font-family:var(--font-mono); text-transform:uppercase; color:var(--ink-soft); margin-top:4px;}
  .qa-chat-empty{color:var(--ink-soft); font-size:.86rem;}
  .qa-chat-form{display:flex; gap:8px; padding:12px 16px; border-top:1px solid var(--line);}
  .qa-chat-form input{flex:1;}
  .qa-outputs-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:14px; margin-top:20px;}
  .qa-output-card{border:1px solid var(--line); background:var(--surface); padding:16px; display:flex; flex-direction:column; gap:8px;}
  .qa-output-type{align-self:flex-start; font-size:.68rem; font-family:var(--font-mono); text-transform:uppercase; color:var(--accent); border:1px solid var(--accent); padding:.2em .5em;}
  .qa-output-card h3{margin:0; font-size:.9rem;}
  .qa-output-card ul{margin:0; padding-left:18px; font-size:.8rem; color:var(--ink-soft); display:flex; flex-direction:column; gap:4px;}
  .glossary-term{color:var(--accent-2); border-bottom:1px dotted var(--accent-2); font-weight:600; cursor:pointer;}
  .glossary-term:hover{background:var(--paper-2);}
  .qa-glossary-panel{border:1px solid var(--line); border-left:3px solid var(--accent-2); background:var(--surface); padding:16px 20px; margin-top:16px;}
  .qa-glossary-hint{margin:0; font-size:.86rem; color:var(--ink-soft);}
  .qa-glossary-term{display:inline-block; font-family:var(--font-mono); font-size:.7rem; text-transform:uppercase; letter-spacing:.04em; color:var(--accent-2); border:1px solid var(--accent-2); padding:.15em .5em; margin-bottom:8px;}
  .qa-glossary-panel h3{margin:0 0 6px; font-size:.98rem;}
  .qa-glossary-panel p{margin:0 0 10px; font-size:.86rem; color:var(--ink-soft);}
  .qa-notfound{border:1px solid var(--line); background:var(--paper-2); padding:20px; margin-top:24px;}
  .qa-notfound h3{margin:0 0 6px; font-size:1rem;}
  .qa-notfound p{margin:0 0 12px; font-size:.86rem; color:var(--ink-soft);}
  .qa-notfound-form{display:flex; gap:8px; flex-wrap:wrap;}
  .qa-notfound-form textarea{flex:1; min-width:220px; min-height:44px; resize:vertical; font-family:inherit;}

  section{padding:38px 0;}
  section.alt{background:var(--paper-2); border-top:1px solid var(--line); border-bottom:1px solid var(--line);}
  .section-head{display:flex; justify-content:space-between; align-items:flex-end; gap:16px; margin-bottom:20px; flex-wrap:wrap;}
  .section-head h2{font-size:1.35rem; margin:0;}

  /* stats */
  .stats-strip{display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:1px; background:var(--line); border:1px solid var(--line);}
  .stat-cell{background:var(--surface); padding:16px; display:flex; flex-direction:column; gap:4px;}
  .stat-cell .val{font-family:var(--font-mono); font-size:1.5rem; font-weight:700; color:var(--accent);}
  .stat-cell .lab{font-size:.76rem; color:var(--ink-soft);}

  /* filter bar */
  .filter-bar{display:flex; flex-wrap:wrap; gap:10px; align-items:end; background:var(--paper-2); border:1px solid var(--line); border-radius:2px; padding:16px; margin-bottom:20px;}
  .escrow-note{font-size:.76rem; color:var(--ink-soft); margin:-10px 0 18px;}
  .filter-bar .field{flex:1; min-width:140px;}
  .filter-bar label{margin-bottom:.3em;}

  /* listing rows */
  .manifest{border:1px solid var(--line); background:var(--surface);}
  .m-row{display:grid; grid-template-columns:auto auto 1fr auto auto auto auto auto auto; gap:16px; align-items:center; padding:12px 16px; border-bottom:1px solid var(--line);}
  .permit-no{color:var(--danger); font-weight:700;}
  .m-row:last-child{border-bottom:none;}
  .m-row:hover{background:var(--paper-2);}
  @media (max-width:900px){.m-row{grid-template-columns:1fr; gap:6px;}}
  .m-id{font-family:var(--font-mono); font-size:.78rem; color:var(--ink-soft); white-space:nowrap;}
  .mode-chip{display:inline-flex; align-items:center; gap:6px; font-size:.72rem; font-weight:700; text-transform:uppercase; letter-spacing:.04em; padding:.3em .55em; border:1px solid var(--line); color:var(--ink-soft); font-family:var(--font-mono);}
  .mode-chip.auto{color:var(--mode-auto); border-color:var(--mode-auto);} .mode-chip.rail{color:var(--mode-rail); border-color:var(--mode-rail);} .mode-chip.sea{color:var(--mode-sea); border-color:var(--mode-sea);} .mode-chip.air{color:var(--mode-air); border-color:var(--mode-air);} .mode-chip.drone{color:var(--mode-drone); border-color:var(--mode-drone);} .mode-chip.multi{color:var(--mode-multi); border-color:var(--mode-multi);}
  .m-route{font-weight:700; display:flex; align-items:center; gap:6px;}
  .m-route .country-flag{flex:none;}
  .m-route .arr{color:var(--ink-soft); font-weight:400; margin:0 2px;}
  .m-sub{font-size:.78rem; color:var(--ink-soft);}
  .m-figure{font-family:var(--font-mono); text-align:right; font-size:.86rem;}
  .m-figure .lab{display:block; font-size:.66rem; color:var(--ink-soft); text-transform:uppercase;}
  /* Real links into the site's own sections (Довідник/Кордони/Погода/Карта),
     not decoration - matches trans-atlas.net's per-listing "Сервіси" icon
     column, but here each icon leads somewhere that actually has data:
     Кордони pre-filters to the listing's destination country, Погода
     pre-loads the listing's actual route - see bindEvents' m-svc-* handlers. */
  .m-services{display:flex; gap:6px;}
  .m-services a{display:flex; align-items:center; justify-content:center; width:1.9em; height:1.9em; border:1px solid var(--line); color:var(--ink-soft); text-decoration:none;}
  .m-services a:hover{color:var(--accent); border-color:var(--accent); background:var(--paper-2);}
  .m-services svg.icon{width:1.05em; height:1.05em;}
  .empty-state{padding:40px 20px; text-align:center; color:var(--ink-soft);}

  /* market */
  .market-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:1px; background:var(--line); border:1px solid var(--line);}
  .market-card{border:none; background:var(--surface); padding:16px; cursor:pointer; text-align:left; color:inherit;}
  .market-card:hover{background:var(--paper-2);}
  .market-card.active{background:var(--paper-2); box-shadow:inset 0 -2px 0 var(--accent);}
  .market-card svg.icon{width:1.7em; height:1.7em; color:var(--accent); margin-bottom:10px;}
  .market-card .mk-title{font-weight:700; font-size:.9rem;}
  .market-card .mk-count{font-family:var(--font-mono); font-size:.76rem; color:var(--ink-soft);}
  .market-mock-row{display:flex; align-items:center; gap:14px; padding:12px 16px; border-bottom:1px solid var(--line);}
  .market-mock-row:last-child{border-bottom:none;}
  .market-mock-row .m-route{flex:1;}

  /* rating */
  .rating-list{border:1px solid var(--line); background:var(--surface);}
  .rating-row{display:flex; align-items:center; gap:14px; padding:12px 16px; border-bottom:1px solid var(--line);}
  .rating-row:last-child{border-bottom:none;}
  .rating-row:hover{background:var(--paper-2);}
  .rating-rank{font-family:var(--font-mono); font-weight:700; color:var(--ink-soft); width:2em; flex:none;}
  .rating-company{flex:1; min-width:0;}
  .rating-price{font-family:var(--font-mono); font-weight:700; font-size:.95rem; flex:none;}

  /* news */
  .news-list{display:flex; flex-direction:column; gap:0; border-top:1px solid var(--line);}
  .news-item{padding:18px 0; border-bottom:1px solid var(--line);}
  .news-item .n-date{font-family:var(--font-mono); font-size:.74rem; color:var(--accent); text-transform:uppercase; letter-spacing:.06em;}
  .news-item h3{font-size:1.05rem; margin:.3em 0;}
  .news-item .n-excerpt{color:var(--ink-soft); font-size:.9rem;}
  .news-item .n-more{margin-top:8px;}

  /* about */
  .steps{display:grid; grid-template-columns:repeat(4,1fr); gap:1px; background:var(--line); border:1px solid var(--line);}
  @media (max-width:820px){.steps{grid-template-columns:repeat(2,1fr);}}
  .step-card{border:none; background:var(--surface); padding:16px;}
  .step-card .s-num{font-family:var(--font-mono); color:var(--accent); font-weight:700; font-size:1.1rem;}
  .info-cards{display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-top:14px;}
  @media (max-width:760px){.info-cards{grid-template-columns:1fr;}}
  .info-card{border:1px solid var(--line); border-left:3px solid var(--line); background:var(--surface); padding:18px;}
  .info-card.warn{border-left-color:var(--danger);}
  .info-card.good{border-left-color:var(--success);}

  /* contacts */
  .contact-grid{display:grid; grid-template-columns:1fr 1fr; gap:28px;}
  @media (max-width:860px){.contact-grid{grid-template-columns:1fr;}}
  .office-list{display:flex; flex-direction:column; gap:0; border:1px solid var(--line);}
  .office{background:var(--surface); padding:14px 16px; border-bottom:1px solid var(--line);}
  .office:last-child{border-bottom:none;}
  .office .o-city{font-weight:700;}
  .office .o-line{font-size:.86rem; color:var(--ink-soft); display:flex; align-items:center; gap:6px; margin-top:3px;}
  .office a{color:var(--ink-soft); text-decoration:none;}
  .office a:hover{color:var(--accent);}

  /* footer */
  footer.site{border-top:1px solid var(--line); background:var(--paper-2); padding:36px 0 20px;}
  .foot-grid{display:grid; grid-template-columns:1.4fr repeat(3,1fr); gap:24px;}
  @media (max-width:800px){.foot-grid{grid-template-columns:1fr 1fr;}}
  .foot-col h4{font-family:var(--font-mono); font-size:.72rem; text-transform:uppercase; letter-spacing:.1em; color:var(--ink-soft); margin-bottom:.8em;}
  .foot-col a{display:block; color:var(--ink); text-decoration:none; font-size:.88rem; padding:.25em 0;}
  .foot-col a:hover{color:var(--accent);}
  .foot-bottom{display:flex; justify-content:space-between; align-items:center; margin-top:28px; padding-top:16px; border-top:1px solid var(--line); font-size:.78rem; color:var(--ink-soft); flex-wrap:wrap; gap:10px;}

  /* modal */
  .modal-backdrop{position:fixed; inset:0; background:rgba(10,16,20,.5); display:none; align-items:center; justify-content:center; z-index:100; padding:20px;}
  .modal-backdrop.open{display:flex;}
  .modal{background:var(--surface); border-radius:2px; width:100%; max-width:400px; padding:26px; border:1px solid var(--line); box-shadow:0 8px 24px var(--shadow); max-height:90vh; overflow:auto;}
  .modal-head{display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;}
  .modal-close{border:none; background:none; cursor:pointer; color:var(--ink-soft); padding:4px;}
  .modal .field{margin-bottom:14px;}
  .modal-switch{font-size:.85rem; text-align:center; margin-top:14px; color:var(--ink-soft);}
  .modal-switch button{background:none; border:none; color:var(--accent); font-weight:700; cursor:pointer; padding:0;}

  /* toast */
  #toast{position:fixed; bottom:20px; right:20px; z-index:200; display:flex; flex-direction:column; gap:8px;}
  .toast{background:var(--ink); color:var(--paper); padding:.8em 1.1em; border-radius:2px; font-size:.86rem; box-shadow:0 6px 16px var(--shadow); display:flex; align-items:center; gap:8px; animation:toast-in .18s ease-out;}
  .toast.err{background:var(--danger);}
  @keyframes toast-in{from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:translateY(0);}}
  @media (prefers-reduced-motion:reduce){ *{animation-duration:.001s !important; transition-duration:.001s !important;} }

  /* ---------- RTL (арабська) ----------
     dir="rtl" на <html> (renderApp) вже безкоштовно дзеркалить текст,
     порядок головної осі flex-row і порядок колонок CSS grid - це не
     потребує правок тут. Нижче виправлені лише декларації, які замість
     логічних властивостей використовують фізичні left/right/border та
     padding, тому direction:rtl їх не чіпає - без цього блоку сторінка
     мовою ar лишалась би зверстаною зліва направо всередині RTL-тексту. */
  [dir="rtl"]{direction:rtl; text-align:right;}
  [dir="rtl"] .lang-box{right:auto; left:0;}
  [dir="rtl"] .lang-menu{right:auto; left:0;}
  [dir="rtl"] .lang-menu button{text-align:right;}
  [dir="rtl"] .navlink-dropdown-menu{left:auto; right:0;}
  [dir="rtl"] .banner-panel{text-align:right;}

  [dir="rtl"] .mode-tabs button{border-right:none; border-left:1px solid var(--line);}

  [dir="rtl"] .flow-country:nth-child(odd){border-right:none; border-left:1px solid var(--line);}

  [dir="rtl"] .market-card{text-align:right;}

  [dir="rtl"] .border-row .br-queue{text-align:left;}

  @media (max-width:980px){

/* ---------- filtering ---------- */
function filteredListings(kind){
  return LISTINGS.filter(function(l){
    if(l.kind!==kind) return false;
    if(state.filters.mode!=="all" && l.mode!==state.filters.mode) return false;
    if(state.filters.mode==="multi" && state.filters.multiModes.length){
      var comps = l.components || [];
      var matches = state.filters.multiModes.some(function(mm){ return comps.indexOf(mm)>-1; });
      if(!matches) return false;
    }
    if(state.filters.from && l.from!==state.filters.from) return false;
    if(state.filters.to && l.to!==state.filters.to) return false;
    // Country-level scope, set when a Транс/Вантаж export or import number
    // in the homepage flow tables (see renderFlowPanel) is clicked - a
    // country can span several CITIES entries, so this checks the listing's
    // resolved country rather than an exact city like from/to above.
    if(state.filters.fromCountry && cityCountry(l.from)!==state.filters.fromCountry) return false;
    if(state.filters.toCountry && cityCountry(l.to)!==state.filters.toCountry) return false;
    if(state.filters.borderScope){
      var crossBorder = cityCountry(l.from)!==cityCountry(l.to);
      if(state.filters.borderScope==="international" && !crossBorder) return false;
      if(state.filters.borderScope==="domestic" && crossBorder) return false;
    }
    if(state.filters.currency && l.currency!==state.filters.currency) return false;
    return true;
  });
}

var FLOW_CONTINENTS = ["europe","asia","america","africa","australia"];
/** Every CITIES entry is European in this demo dataset - only "europe" has
 * real listings behind it. Other continents render the tab (so the UI shape
 * matches the real site and future work has somewhere to plug data in) but
 * show an honest "not connected" note instead of a fabricated zero table -
 * same pattern as the Азія tab in Кордони/Погода. */
var FLOW_CONTINENT_COUNTRIES = {europe: null, asia: [], america: [], africa: [], australia: []};

/**
 * Per-country, per-kind export/import counts for the homepage flow tables,
 * computed live from LISTINGS (mock data today, a real feed later - nothing
 * here is hand-typed). This is the site's core direction logic, kept in one
 * place so future work (real backend, country-pair drilldown, more
 * continents) has a single spot to extend rather than several to keep in
 * sync:
 *
 *   - `kind` splits the two rows the real site shows per country: "transport"
 *     (Транс - free capacity a carrier posted) vs "cargo" (Грузы - a load a
 *     shipper posted) - this maps directly onto LISTINGS' existing `kind`
 *     field, nothing new to invent.
 *   - Export (blue) for country X = active postings of that kind
 *     ORIGINATING in X.
 *   - Import (yellow) for country X = active postings of that kind ENDING
 *     in X.
 *   - `international` selects only cross-border postings (origin country
 *     !== destination country); pass false for domestic-only (same country
 *     on both ends) - for those, a listing counts as both an export AND an
 *     import for that one country (a load picked up and dropped off within
 *     the same country's borders), so the two numbers land equal by
 *     construction for a given kind. That's expected, not a bug.
 *
 * Returns counts[countryCode][kind] = {exportCount, importCount}.
 */
function countryFlowStats(international){
  var counts = {};
  function bump(country, kind, field){
    if(!country) return;
    if(!counts[country]) counts[country] = {transport:{exportCount:0,importCount:0}, cargo:{exportCount:0,importCount:0}};
    counts[country][kind][field]++;
  }
  LISTINGS.forEach(function(l){
    var fromCountry = cityCountry(l.from);
    var toCountry = cityCountry(l.to);
    if(!fromCountry || !toCountry) return;
    var isCrossBorder = fromCountry !== toCountry;
    if(international !== isCrossBorder) return;
    bump(fromCountry, l.kind, "exportCount");
    bump(toCountry, l.kind, "importCount");
  });
  return counts;
}

/**
 * Each number is a real drill-down, not decoration: clicking it sets a
 * country-level scope on the shared search filters (see filteredListings)
 * and jumps straight to the matching Вантаж/Транспорт results list -
 * mirrors how trans-atlas.net's own Транс/Грузы numbers behave.
 */
function renderFlowNum(kindLabel, exportCount, importCount, countryCode, kind, international){
  var route = kind==="transport" ? "transport" : "cargo";
  var scope = international ? "international" : "domestic";
  function btn(dir, count, icon, titleKey){

  }
  return ''+
  '<div class="flow-subrow">'+
    '<span class="flow-kind">'+esc(kindLabel)+'</span>'+
    btn("export", exportCount, ICONS.arrowLeft, "flow_export")+
    btn("import", importCount, ICONS.arrowRight, "flow_import")+
  '</div>';
}

function renderFlowPanel(international){
  var stateKey = international ? "intlContinent" : "domesticContinent";
  var continent = state.flows[stateKey];

/* ---------- render: company rating ---------- */
/** Every mock listing has exactly one company, so "ranking" them can't be a
 * repeat-business or volume count - it's real per-listing value instead
 * (price), sorted high to low. No star ratings, review counts, or trust
 * scores are invented here: this is demo data (see rating_lede), and the
 * one honest number we actually have is what each current listing is
 * worth. */
function renderRating(){
  // Заявки в різних валютах не можна чесно порівняти сумою без підключеного
  // джерела курсу (ТЗ, розд. 13.3: "за недоступності джерела - показати
  // застарілий курс, не вигадувати"; тут курсу немає взагалі) - тому спершу
  // групуємо за валютою заявки, і лише всередині однієї валюти сортуємо за
  // сумою, замість вигаданого крос-валютного порівняння.
  var ranked = LISTINGS.slice().sort(function(a, b){
    if(a.currency!==b.currency) return a.currency<b.currency? -1 : 1;
    return b.price - a.price;
  });
  var rowsHtml = ranked.map(function(l, i){
    var modeIcon = ICONS[MODE_ICON[l.mode]];
    return ''+
    '<div class="rating-row">'+
      '<span class="rating-rank">#'+(i+1)+'</span>'+
      '<div class="rating-company">'+
        '<div class="m-route" style="font-size:.92rem;">'+esc(l.company)+'</div>'+
        '<div class="m-sub">'+esc(cityName(l.from,state.lang))+'<span class="arr">&rarr;</span>'+esc(cityName(l.to,state.lang))+'</div>'+
      '</div>'+
      '<span class="mode-chip '+l.mode+'">'+modeIcon+t("mode_"+l.mode)+'</span>'+
      '<span class="rating-price">'+priceStr(l)+'</span>'+
    '</div>';
  }).join("");

  return ''+
  '<section><div class="wrap">'+
    '<p class="eyebrow">'+esc(t("services_title"))+'</p>'+
    '<h1>'+esc(t("rating_title"))+'</h1><p class="lede">'+esc(t("rating_lede"))+'</p>'+
    '<div class="rating-list" style="margin-top:22px;">'+rowsHtml+'</div>'+
  '</div></section>';
}

/* ---------- page dispatcher ---------- */
function weatherRiskLabel(code){
  var map = {ice_risk:"weather_risk_ice", high_wind:"weather_risk_wind", heavy_rain:"weather_risk_rain"};
  return map[code] ? t(map[code]) : code;
}
function minutesAgo(iso){
  var mins = Math.max(0, Math.round((Date.now()-new Date(iso).getTime())/60000));
  if(mins < 1) return "<1 " + (state.lang==="uk"?"хв":"min");
  return mins + " " + (state.lang==="uk"?"хв":"min");
}
var FLIGHT_CATEGORY_COLOR = {VFR:"green", MVFR:"yellow", IFR:"red", LIFR:"red"};
function renderAlertsBlock(alerts){
  if(!alerts || !alerts.length) return "";
  var top = alerts.slice(0,3);
  return '<div class="weather-alerts"><span class="eyebrow">'+esc(t("weather_alerts_title"))+'</span><ul class="weather-risk-list">'+
    top.map(function(a){
      return '<li class="'+(a.color==="yellow"?"color-yellow":"")+'">'+ICONS.pin+esc(a.event)+(a.areaDesc?' &middot; '+esc(a.areaDesc):'')+'</li>';
    }).join("")+
    (alerts.length>3 ? '<li class="weather-msg" style="margin:0;">+'+(alerts.length-3)+'</li>' : '')+
  '</ul></div>';
}
function renderRoadCard(label, result){
  var wp = result.data;
  var cur = wp.payload.current;
  var forecastHtml = wp.payload.next12h.map(function(h){
    var hour = h.time.slice(11,16);
    return '<div class="weather-hour"><span class="wh-time">'+hour+'</span><span class="wh-temp num">'+Math.round(h.temperatureC)+'&deg;</span><span class="wh-cond">'+esc(h.conditionUk)+'</span></div>';
  }).join("");
  var riskHtml = wp.payload.road_risk.length
    ? '<ul class="weather-risk-list">'+wp.payload.road_risk.map(function(r){ return '<li>'+ICONS.pin+esc(weatherRiskLabel(r.code))+'</li>'; }).join("")+'</ul>'
    : '<p class="weather-msg good">'+esc(t("weather_no_risk"))+'</p>';
  return ''+
    '<div class="weather-current"><span class="wc-temp num">'+Math.round(cur.temperatureC)+'&deg;C</span><span class="wc-cond">'+esc(cur.conditionUk)+'</span>'+
      '<span class="wc-sub">'+esc(t("weather_current"))+' &middot; '+Math.round(cur.windSpeedKmh)+' km/h &middot; '+cur.precipitationMm+' mm</span></div>'+
    '<div class="weather-risk"><span class="eyebrow">'+esc(t("weather_risk_title"))+'</span>'+riskHtml+'</div>'+
    renderAlertsBlock(wp.alerts)+
    '<div class="weather-forecast"><span class="eyebrow">'+esc(t("weather_forecast"))+'</span><div class="weather-hours">'+forecastHtml+'</div></div>';
}
function renderAirCard(label, result){
  var wp = result.data;
  var metar = wp.payload.metar;
  if(!metar){
    return '<p class="weather-msg">'+esc(t("weather_no_metar"))+'</p>';
  }
  var cat = metar.flightCategory;
  var catPill = cat ? '<span class="status-pill '+(FLIGHT_CATEGORY_COLOR[cat]||"unknown")+'">'+esc(cat)+'</span>' : '<span class="status-pill unknown">'+esc(t("borders_status_unknown"))+'</span>';
  return ''+
    '<div class="weather-current"><span class="wc-temp num">'+(metar.tempC!=null?Math.round(metar.tempC):"—")+'&deg;C</span>'+catPill+
      '<span class="wc-sub">'+(metar.windKt!=null?metar.windKt+' kt':"")+(metar.visibility?' &middot; '+esc(metar.visibility)+' SM':"")+'</span></div>'+
    '<div class="weather-forecast"><span class="eyebrow">METAR</span><p class="weather-msg" style="font-family:var(--font-mono);font-size:.78rem;margin-top:6px;">'+esc(metar.raw)+'</p></div>'+
    (wp.payload.taf ? '<div class="weather-forecast"><span class="eyebrow">TAF</span><p class="weather-msg" style="font-family:var(--font-mono);font-size:.72rem;margin-top:6px;word-break:break-word;">'+esc(wp.payload.taf.raw)+'</p></div>' : '');
}
function renderWeatherPointCard(label, result){
  if(!result || result.error){
    return '<div class="weather-card"><h3>'+esc(label)+'</h3><p class="weather-msg">'+esc(t("weather_error"))+'</p></div>';
  }
  var wp = result.data;
  var inner = wp.transport_mode==="air" ? renderAirCard(label, result) : renderRoadCard(label, result);
  return ''+
  '<div class="weather-card">'+
    '<h3>'+esc(label)+(result.stale?' <span class="weather-stale-badge">stale</span>':'')+'</h3>'+
    inner+
    '<div class="weather-provenance"><a href="'+esc(wp.source_url)+'" target="_blank" rel="noopener">'+esc(t("weather_source"))+': '+esc(wp.source_name)+'</a> &middot; '+esc(t("weather_updated"))+' '+minutesAgo(wp.updated_at)+'</div>'+
  '</div>';
}
function renderWeather(){
  var w = state.weather;
  var tabs = ["road","rail","sea","air"].map(function(m){
    var iconKey = {road:"truck", rail:"train", sea:"ship", air:"plane"}[m];
    return '<button data-weathertab="'+m+'" class="'+(w.tab===m?"active":"")+'">'+ICONS[iconKey]+'<span>'+esc(t("weather_tab_"+m))+'</span></button>';
  }).join("");

  var body;
  if(w.tab==="rail" || w.tab==="sea"){
    body = '<div class="weather-card"><p class="weather-msg">'+esc(t("weather_not_ready"))+'</p></div>';
  } else if(w.loading){
    body = '<p class="weather-msg">'+esc(t("weather_loading"))+'</p>';
  } else if(w.error==="offline"){
    body = '<div class="weather-card warn-card"><p class="weather-msg">'+esc(t("weather_offline"))+'</p></div>';
  } else if(w.error){
    body = '<p class="weather-msg">'+esc(t("weather_error"))+'</p>';
  } else if(w.points){
    body = '<div class="weather-grid">'+
      renderWeatherPointCard(w.points.fromLabel, w.points.from)+
      renderWeatherPointCard(w.points.toLabel, w.points.to)+
    '</div>';
  } else {
    body = '<p class="weather-msg">'+esc(t("weather_pick_points"))+'</p>';
  }

  return ''+
  '<section><div class="wrap">'+
    '<p class="eyebrow">'+esc(t("nav_market"))+'</p><h1>'+esc(t("weather_title"))+'</h1><p class="lede">'+esc(t("weather_lede"))+'</p>'+
    '<div class="mode-tabs" style="max-width:520px;margin:20px 0 16px;">'+tabs+'</div>'+
    '<div class="filter-bar">'+

/**
 * Terms in the Outputs checklists (ADR, CMR, Incoterms codes, T1/NCTS...)
 * that are unfamiliar unless you work in logistics - each maps to the real
 * wiki article that actually explains it. Deliberately NOT exhaustive: a
 * term only appears here if server/data/wiki.json really defines it, so
 * clicking a highlighted word never shows a made-up explanation. Extend
 * this list alongside wiki.json, not ahead of it.
 */
var GLOSSARY_TERMS = [
  {term:"CMR", wikiId:"cmr-waybill"},
  {term:"ADR", wikiId:"adr-dangerous-goods"},
  {term:"TIR", wikiId:"tir-carnet"},
  {term:"МДП", wikiId:"tir-carnet"},
  {term:"Зелена картка", wikiId:"green-card-insurance"},
  {term:"Green Card", wikiId:"green-card-insurance"},
  {term:"Incoterms", wikiId:"incoterms-2020"},
  {term:"Інкотермс", wikiId:"incoterms-2020"},
  {term:"EXW", wikiId:"incoterms-2020"}, {term:"FCA", wikiId:"incoterms-2020"},
  {term:"CPT", wikiId:"incoterms-2020"}, {term:"CIP", wikiId:"incoterms-2020"},
  {term:"DAP", wikiId:"incoterms-2020"}, {term:"DPU", wikiId:"incoterms-2020"},
  {term:"DDP", wikiId:"incoterms-2020"}, {term:"FOB", wikiId:"incoterms-2020"},
  {term:"CFR", wikiId:"incoterms-2020"}, {term:"CIF", wikiId:"incoterms-2020"},
  {term:"NCTS", wikiId:"eu-customs-transit"},
  {term:"T1", wikiId:"eu-customs-transit"}, {term:"T2", wikiId:"eu-customs-transit"}
];

/** Wraps every GLOSSARY_TERMS match in `text` as a clickable span, after
 * escaping the text (so this is the one place output-item text passes
 * through - callers should not esc() it again). Uses \p{L}/\p{N} lookaround
 * instead of \b, because JS's \b only understands ASCII word characters and
 * silently fails to match at the edges of Cyrillic terms like "Зелена
 * картка". */
function linkifyGlossary(text){
  var html = esc(text);
  GLOSSARY_TERMS.forEach(function(g){
    var escapedTerm = g.term.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
    var re = new RegExp("(?<![\\p{L}\\p{N}])" + escapedTerm + "(?![\\p{L}\\p{N}])", "gu");
    html = html.replace(re, function(m){
      return '<span class="glossary-term" data-term-wiki="'+g.wikiId+'" data-term-label="'+esc(m)+'">'+m+'</span>';
    });
  });
  return html;
}

function askQa(question){
  var qa = state.qa;
  qa.messages.push({role:"user", text:question});
  qa.asking = true;
  renderApp();
  fetch(WEATHER_API_BASE+"/api/qa/ask", {
    method:"POST",
    headers:{"content-type":"application/json"},
    body: JSON.stringify({question: question})
  }).then(function(res){
    return res.json().then(function(json){
      qa.asking = false;
      if(!res.ok){
        qa.messages.push({role:"assistant", warn:true, text: t("qa_error"), sources: json.sources||[]});
        renderApp();
        return;
      }
      if(json.insufficient){
        qa.messages.push({role:"assistant", warn:true, text: json.message_uk || t("qa_insufficient"), sources:[]});
      } else if(json.aiUnavailable){
        qa.messages.push({role:"assistant", warn:true, text: t("qa_ai_unavailable"), sources: json.sources||[]});
      } else {
        qa.messages.push({role:"assistant", text: json.answer, sources: json.sources||[], confidence: json.confidence});
      }
      renderApp();
    });
  }).catch(function(err){
    qa.asking = false;
    var offline = /Failed to fetch|NetworkError|ECONNREFUSED|Load failed/i.test(err.message||"");
    qa.messages.push({role:"assistant", warn:true, text: offline ? t("qa_offline") : t("qa_error"), sources:[]});
    renderApp();
  });
}

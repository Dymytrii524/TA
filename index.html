<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Trans-Atlas - mizhnarodna birzha vantazhoperevezen: poshuk vantazhiv i transportu, rynok tekhniky, novyny, bagatomovnyi interfeis (UA/EN/PL/DE).">
<title>Trans-Atlas</title>
<style>
  :root{
    --paper:#FFFFFF; --paper-2:#F1F4F8; --surface:#FFFFFF;
    --ink:#1B2733; --ink-soft:#5B6B7A; --line:#D6DEE6;
    --accent:#1B5FA8; --accent-ink:#FFFFFF; --accent-2:#123F70;
    --success:#2E7D5B; --warning:#B4791D; --danger:#B23B2E;
    --mode-auto:#1B5FA8; --mode-rail:#B4791D; --mode-sea:#0E7C86; --mode-air:#B23B2E; --mode-multi:#6A4C93;
    --mode-auto-dk:#0E3E6B; --mode-rail-dk:#7A4E10; --mode-sea-dk:#074850; --mode-air-dk:#6E2018; --mode-multi-dk:#3E2A5C;
    --shadow:rgba(20,33,50,.12);
    --font-display:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --font-body:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --font-mono:ui-monospace,"Cascadia Mono","SFMono-Regular",Consolas,monospace;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper:#0E1620; --paper-2:#141F2C; --surface:#121C27;
      --ink:#E6EBF0; --ink-soft:#93A3B2; --line:#25333F;
      --accent:#5B9BDB; --accent-ink:#0E1620; --accent-2:#8FC0EE;
      --success:#4FAE85; --warning:#D3A551; --danger:#E17862;
      --mode-auto:#5B9BDB; --mode-rail:#D3A551; --mode-sea:#4FB8C4; --mode-air:#E17862; --mode-multi:#B79AE0;
      --shadow:rgba(0,0,0,.4);
    }
  }
  :root[data-theme="dark"]{
    --paper:#0E1620; --paper-2:#141F2C; --surface:#121C27;
    --ink:#E6EBF0; --ink-soft:#93A3B2; --line:#25333F;
    --accent:#5B9BDB; --accent-ink:#0E1620; --accent-2:#8FC0EE;
    --success:#4FAE85; --warning:#D3A551; --danger:#E17862;
    --mode-auto:#5B9BDB; --mode-rail:#D3A551; --mode-sea:#4FB8C4; --mode-air:#E17862; --mode-multi:#B79AE0;
    --shadow:rgba(0,0,0,.4);
  }

  *{box-sizing:border-box;}
  html{color-scheme:light dark;}
  body{
    margin:0; background:var(--paper); color:var(--ink);
    font-family:var(--font-body); line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,h4{font-family:var(--font-display); text-wrap:balance; margin:0 0 .4em; letter-spacing:0; font-weight:700;}
  p{margin:0 0 1em; max-width:64ch;}
  a{color:var(--accent);}
  button{font-family:inherit;}
  ::selection{background:var(--accent); color:var(--accent-ink);}
  :focus-visible{outline:2px solid var(--accent); outline-offset:2px;}
  .num{font-variant-numeric:tabular-nums; font-family:var(--font-mono);}
  .wrap{max-width:1180px; margin:0 auto; padding:0 20px;}
  .eyebrow{font-family:var(--font-mono); text-transform:uppercase; letter-spacing:.12em; font-size:.72rem; color:var(--ink-soft);}
  .btn{
    display:inline-flex; align-items:center; gap:8px; border:1px solid var(--line);
    background:var(--surface); color:var(--ink); padding:.6em 1.1em; border-radius:2px;
    font-weight:600; font-size:.92rem; cursor:pointer; transition:background-color .15s, border-color .15s;
  }
  .btn:hover{border-color:var(--accent);}
  .btn:active{transform:translateY(1px);}
  .btn-primary{background:var(--accent); color:var(--accent-ink); border-color:var(--accent);}
  .btn-primary:hover{background:var(--accent-2); border-color:var(--accent-2);}
  .btn-ghost{background:transparent; border-color:transparent; color:var(--ink-soft);}
  .btn-ghost:hover{color:var(--ink); border-color:var(--line);}
  .btn-sm{padding:.4em .8em; font-size:.82rem;}
  .btn[disabled]{opacity:.5; cursor:not-allowed;}
  .linklike{background:none; border:none; color:var(--accent); font-weight:600; font-size:.85rem; cursor:pointer; padding:0; text-decoration:none; display:inline-block;}
  .linklike:hover{text-decoration:underline;}
  input,select,textarea{
    font-family:inherit; font-size:.94rem; padding:.6em .75em; border:1px solid var(--line);
    border-radius:2px; background:var(--surface); color:var(--ink); width:100%;
  }
  input:focus,select:focus,textarea:focus{border-color:var(--accent);}
  label{display:block; font-size:.78rem; font-family:var(--font-mono); text-transform:uppercase; letter-spacing:.06em; color:var(--ink-soft); margin-bottom:.35em;}
  .field-err{color:var(--danger); font-size:.78rem; margin-top:.3em; display:none;}
  .field.invalid input,.field.invalid select,.field.invalid textarea{border-color:var(--danger);}
  .field.invalid .field-err{display:block;}
  svg.icon{width:1.15em; height:1.15em; stroke:currentColor; fill:none; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round; flex:none;}

  /* header */
  .topline{height:10px; background:#F3C892;}
  header.site{background:var(--paper); border-bottom:1px solid var(--line);}
  .utilitybar{background:var(--accent-2);}
  .utility-row{display:flex; justify-content:flex-end; align-items:center; gap:10px; padding:8px 20px; max-width:1180px; margin:0 auto;}
  .util-btn{border:none; background:rgba(255,255,255,.16); color:#fff; padding:.55em 1.1em; font-weight:600; font-size:.82rem; cursor:pointer; border-radius:2px;}
  .util-btn:hover{background:rgba(255,255,255,.26);}
  .util-btn.primary{background:#fff; color:var(--accent-2);}
  .util-btn.primary:hover{background:#EAF1F8;}
  .auth-inline{display:flex; align-items:center; gap:8px;}
  .user-chip{display:flex; align-items:center; gap:8px; font-size:.82rem; font-weight:600; color:#fff;}
  .user-chip .avatar{width:22px; height:22px; border-radius:50%; background:#fff; color:var(--accent-2); display:flex; align-items:center; justify-content:center; font-size:.68rem; font-weight:700;}
  .logorow{padding:18px 20px;}
  .logorow-inner{max-width:1180px; margin:0 auto; display:flex; align-items:center; justify-content:center; position:relative;}
  .logo{display:flex; flex-direction:column; align-items:center; gap:2px; cursor:pointer; border:none; background:none; color:inherit; text-align:center; padding:0;}
  .logo .wordmark{font-family:var(--font-display); font-weight:700; font-size:1.9rem; letter-spacing:.02em;}
  .logo .wordmark b{color:var(--accent); font-weight:700;}
  .logo .tagline{font-family:var(--font-mono); font-size:.66rem; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-soft);}
  .lang-box{position:absolute; right:0; top:50%; transform:translateY(-50%); display:flex; align-items:center; border:1px solid var(--line); border-radius:2px; overflow:hidden;}
  .lang-box button{display:flex; align-items:center; gap:6px; border:none; border-right:1px solid var(--line); background:var(--surface); color:var(--ink-soft); padding:.4em .6em; font-size:.72rem; font-family:var(--font-mono); font-weight:700; cursor:pointer;}
  .lang-box button:last-child{border-right:none;}
  .lang-box button:hover{color:var(--ink);}
  .lang-box button.active{color:var(--accent); background:var(--paper-2);}
  .flag-dot{width:13px; height:13px; border-radius:50%; flex:none; box-shadow:inset 0 0 0 1px rgba(0,0,0,.15);}
  .flag-dot.uk{background:linear-gradient(to bottom,#005BBB 50%,#FFD500 50%);}
  .flag-dot.en{background:linear-gradient(135deg,#00247D 34%,#fff 34% 67%,#CF142B 67%);}
  .flag-dot.pl{background:linear-gradient(to bottom,#fff 50%,#DC143C 50%);}
  .flag-dot.de{background:linear-gradient(to bottom,#000 33%,#DD0000 33% 67%,#FFCE00 67%);}
  .navbar{background:var(--ink); position:relative;}
  .navbar .wrap{display:flex; align-items:center; max-width:1180px; margin:0 auto; padding:0 20px;}
  nav.primary{display:flex; gap:2px; flex:1; flex-wrap:wrap;}
  nav.primary a{
    font-size:.88rem; font-weight:600; color:rgba(255,255,255,.8); text-decoration:none;
    padding:12px 14px; white-space:nowrap; border-bottom:2px solid transparent;
  }
  nav.primary a:hover{color:#fff; background:rgba(255,255,255,.07);}
  nav.primary a.active{color:#fff; border-bottom-color:var(--accent);}
  .burger{display:none; border:1px solid rgba(255,255,255,.3); background:transparent; color:#fff; border-radius:2px; padding:.4em .6em; cursor:pointer;}
  @media (max-width:980px){
    nav.primary{display:none; position:absolute; top:100%; left:0; right:0; background:var(--ink); flex-direction:column; padding:8px; box-shadow:0 4px 10px var(--shadow); z-index:30;}
    nav.primary.open{display:flex;}
    nav.primary a{border-bottom:none; border-left:2px solid transparent;}
    nav.primary a.active{border-left-color:var(--accent); border-bottom-color:transparent;}
    .burger{display:inline-flex;}
    .logo .wordmark{font-size:1.4rem;}
    .lang-box{position:static; transform:none; margin-top:10px;}
    .logorow-inner{flex-direction:column;}
  }

  /* home: lede + banner + dashboard */
  .home-lede{padding:22px 0 0;}
  .home-lede h1{font-size:1.5rem; max-width:none;}
  .home-lede .lede{max-width:60ch; margin-bottom:0;}

  .banner-row{display:grid; grid-template-columns:2fr 1fr 1fr 1fr 1fr; gap:2px; background:var(--line); margin-top:18px;}
  @media (max-width:900px){.banner-row{grid-template-columns:1fr 1fr;}}
  .banner-panel{position:relative; min-height:210px; display:flex; border:none; padding:0; text-align:left; color:#fff; cursor:pointer; overflow:hidden; background-size:cover, cover; background-position:center, center; background-repeat:no-repeat;}
  .banner-panel.mode-auto{background-color:var(--mode-auto); background-image:linear-gradient(180deg, rgba(10,18,28,.1), rgba(8,14,20,.6)), url('images/banner-auto.jpg'); background-position:center 72%, center 72%;}
  .banner-panel.mode-rail{background-color:var(--mode-rail); background-image:linear-gradient(180deg, rgba(10,18,28,.1), rgba(8,14,20,.6)), url('images/banner-rail.jpg');}
  .banner-panel.mode-sea{background-color:var(--mode-sea); background-image:linear-gradient(180deg, rgba(10,18,28,.1), rgba(8,14,20,.6)), url('images/banner-sea.jpg');}
  .banner-panel.mode-air{background-color:var(--mode-air); background-image:linear-gradient(180deg, rgba(10,18,28,.1), rgba(8,14,20,.6)), url('images/banner-air.jpg');}
  .banner-panel.mode-multi{background-color:var(--mode-multi); background-image:linear-gradient(180deg, rgba(10,18,28,.1), rgba(8,14,20,.6)), url('images/banner-multi.jpg');}
  .banner-panel:hover{filter:brightness(1.07);}
  .banner-panel .bp-badge{position:absolute; left:14px; top:14px; width:2.4em; height:2.4em; border-radius:50%; background:rgba(255,255,255,.92); display:flex; align-items:center; justify-content:center; color:var(--accent-2); box-shadow:0 2px 6px rgba(0,0,0,.25);}
  .banner-panel .bp-badge svg.icon{width:1.2em; height:1.2em;}
  .banner-panel.wide{align-items:flex-end; justify-content:flex-start;}
  .banner-panel.wide .bp-overlay{position:relative; background:rgba(255,255,255,.95); color:var(--ink); margin:16px; padding:16px 18px; max-width:320px; border-radius:2px;}
  .banner-panel.wide .bp-overlay h3{margin:0 0 8px; font-size:1.05rem;}
  .banner-panel.wide .bp-overlay p{margin:0; font-size:.82rem; color:var(--ink-soft); max-width:none;}
  .banner-panel:not(.wide){align-items:flex-end; justify-content:center; padding-bottom:14px;}
  .banner-panel:not(.wide) .bp-label{position:relative; color:#fff; font-weight:700; font-size:.85rem; text-align:center; text-shadow:0 1px 4px rgba(0,0,0,.55);}

  .dash-grid{display:grid; grid-template-columns:300px 1fr 260px; gap:16px; margin:24px 0 40px;}
  @media (max-width:1080px){.dash-grid{grid-template-columns:1fr 1fr;}}
  @media (max-width:760px){.dash-grid{grid-template-columns:1fr;}}
  .dash-col{border:1px solid var(--line); background:var(--surface); align-self:start;}
  .panel-head{background:var(--accent-2); color:#fff; padding:12px 16px; font-weight:700; font-size:.82rem; display:flex; align-items:center; gap:10px; text-transform:uppercase; letter-spacing:.03em;}
  .panel-head svg.icon{width:1.2em; height:1.2em;}
  .panel-body{padding:16px;}
  .panel-body.flush{padding:0;}
  .panel-more{padding:12px 16px; border-top:1px solid var(--line);}

  .mode-tabs{display:flex; gap:0; margin-bottom:16px; border:1px solid var(--line); border-radius:2px; overflow:hidden;}
  .mode-tabs button{flex:1; display:flex; align-items:center; justify-content:center; gap:6px; border:none; border-right:1px solid var(--line); background:var(--paper-2); color:var(--ink-soft); padding:.65em .5em; font-weight:700; font-size:.82rem; cursor:pointer;}
  .mode-tabs button:last-child{border-right:none;}
  .mode-tabs button svg.icon{width:1.1em; height:1.1em;}
  .mode-tabs button.active{background:var(--accent); color:var(--accent-ink);}
  .console-grid{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
  .console-grid .span2{grid-column:1/-1;}

  .services-list{display:flex; flex-direction:column;}
  .services-item{display:flex; align-items:center; gap:12px; padding:12px 16px; border-bottom:1px solid var(--line); color:var(--ink); text-decoration:none; font-size:.86rem; font-weight:600;}
  .services-item:last-child{border-bottom:none;}
  .services-item:hover{background:var(--paper-2); color:var(--accent);}
  .services-item svg.icon{color:var(--accent); width:1.25em; height:1.25em;}

  .mini-widget{border:1px solid var(--line); background:var(--surface); margin-top:16px;}
  .mini-widget-tabs{display:flex;}
  .mini-widget-tabs button{flex:1; border:none; background:var(--paper-2); color:var(--ink-soft); padding:.6em .4em; font-size:.72rem; font-weight:700; cursor:pointer; border-bottom:2px solid transparent;}
  .mini-widget-tabs button.active{background:var(--surface); color:var(--accent); border-bottom-color:var(--accent);}
  .mini-widget-body{padding:14px 16px; font-size:.82rem; color:var(--ink-soft);}

  section{padding:38px 0;}
  section.alt{background:var(--paper-2); border-top:1px solid var(--line); border-bottom:1px solid var(--line);}
  .section-head{display:flex; justify-content:space-between; align-items:flex-end; gap:16px; margin-bottom:20px; flex-wrap:wrap;}
  .section-head h2{font-size:1.35rem; margin:0;}

  /* stats */
  .stats-strip{display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:1px; background:var(--line); border:1px solid var(--line);}
  .stat-cell{background:var(--surface); padding:16px; display:flex; flex-direction:column; gap:4px;}
  .stat-cell .val{font-family:var(--font-mono); font-size:1.5rem; font-weight:700; color:var(--accent);}
  .stat-cell .lab{font-size:.76rem; color:var(--ink-soft);}

  /* filter bar */
  .filter-bar{display:flex; flex-wrap:wrap; gap:10px; align-items:end; background:var(--paper-2); border:1px solid var(--line); border-radius:2px; padding:16px; margin-bottom:20px;}
  .filter-bar .field{flex:1; min-width:140px;}
  .filter-bar label{margin-bottom:.3em;}

  /* listing rows */
  .manifest{border:1px solid var(--line); background:var(--surface);}
  .m-row{display:grid; grid-template-columns:auto 1fr auto auto auto auto; gap:16px; align-items:center; padding:12px 16px; border-bottom:1px solid var(--line);}
  .m-row:last-child{border-bottom:none;}
  .m-row:hover{background:var(--paper-2);}
  @media (max-width:900px){.m-row{grid-template-columns:1fr; gap:6px;}}
  .mode-chip{display:inline-flex; align-items:center; gap:6px; font-size:.72rem; font-weight:700; text-transform:uppercase; letter-spacing:.04em; padding:.3em .55em; border:1px solid var(--line); color:var(--ink-soft); font-family:var(--font-mono);}
  .mode-chip.auto{color:var(--mode-auto); border-color:var(--mode-auto);} .mode-chip.rail{color:var(--mode-rail); border-color:var(--mode-rail);} .mode-chip.sea{color:var(--mode-sea); border-color:var(--mode-sea);} .mode-chip.air{color:var(--mode-air); border-color:var(--mode-air);} .mode-chip.multi{color:var(--mode-multi); border-color:var(--mode-multi);}
  .m-route{font-weight:700; display:flex; align-items:center; gap:8px;}
  .m-route .arr{color:var(--ink-soft); font-weight:400;}
  .m-sub{font-size:.78rem; color:var(--ink-soft);}
  .m-figure{font-family:var(--font-mono); text-align:right; font-size:.86rem;}
  .m-figure .lab{display:block; font-size:.66rem; color:var(--ink-soft); text-transform:uppercase;}
  .empty-state{padding:40px 20px; text-align:center; color:var(--ink-soft);}

  /* market */
  .market-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:1px; background:var(--line); border:1px solid var(--line);}
  .market-card{border:none; background:var(--surface); padding:16px; cursor:pointer; text-align:left; color:inherit;}
  .market-card:hover{background:var(--paper-2);}
  .market-card.active{background:var(--paper-2); box-shadow:inset 0 -2px 0 var(--accent);}
  .market-card svg.icon{width:1.7em; height:1.7em; color:var(--accent); margin-bottom:10px;}
  .market-card .mk-title{font-weight:700; font-size:.9rem;}
  .market-card .mk-count{font-family:var(--font-mono); font-size:.76rem; color:var(--ink-soft);}

  /* news */
  .news-list{display:flex; flex-direction:column; gap:0; border-top:1px solid var(--line);}
  .news-item{padding:18px 0; border-bottom:1px solid var(--line);}
  .news-item .n-date{font-family:var(--font-mono); font-size:.74rem; color:var(--accent); text-transform:uppercase; letter-spacing:.06em;}
  .news-item h3{font-size:1.05rem; margin:.3em 0;}
  .news-item .n-excerpt{color:var(--ink-soft); font-size:.9rem;}
  .news-item .n-more{margin-top:8px;}

  /* about */
  .steps{display:grid; grid-template-columns:repeat(4,1fr); gap:1px; background:var(--line); border:1px solid var(--line);}
  @media (max-width:820px){.steps{grid-template-columns:repeat(2,1fr);}}
  .step-card{border:none; background:var(--surface); padding:16px;}
  .step-card .s-num{font-family:var(--font-mono); color:var(--accent); font-weight:700; font-size:1.1rem;}
  .info-cards{display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-top:14px;}
  @media (max-width:760px){.info-cards{grid-template-columns:1fr;}}
  .info-card{border:1px solid var(--line); border-left:3px solid var(--line); background:var(--surface); padding:18px;}
  .info-card.warn{border-left-color:var(--danger);}
  .info-card.good{border-left-color:var(--success);}

  /* contacts */
  .contact-grid{display:grid; grid-template-columns:1fr 1fr; gap:28px;}
  @media (max-width:860px){.contact-grid{grid-template-columns:1fr;}}
  .office-list{display:flex; flex-direction:column; gap:0; border:1px solid var(--line);}
  .office{background:var(--surface); padding:14px 16px; border-bottom:1px solid var(--line);}
  .office:last-child{border-bottom:none;}
  .office .o-city{font-weight:700;}
  .office .o-line{font-size:.86rem; color:var(--ink-soft); display:flex; align-items:center; gap:6px; margin-top:3px;}
  .office a{color:var(--ink-soft); text-decoration:none;}
  .office a:hover{color:var(--accent);}

  /* footer */
  footer.site{border-top:1px solid var(--line); background:var(--paper-2); padding:36px 0 20px;}
  .foot-grid{display:grid; grid-template-columns:1.4fr repeat(3,1fr); gap:24px;}
  @media (max-width:800px){.foot-grid{grid-template-columns:1fr 1fr;}}
  .foot-col h4{font-family:var(--font-mono); font-size:.72rem; text-transform:uppercase; letter-spacing:.1em; color:var(--ink-soft); margin-bottom:.8em;}
  .foot-col a{display:block; color:var(--ink); text-decoration:none; font-size:.88rem; padding:.25em 0;}
  .foot-col a:hover{color:var(--accent);}
  .foot-bottom{display:flex; justify-content:space-between; align-items:center; margin-top:28px; padding-top:16px; border-top:1px solid var(--line); font-size:.78rem; color:var(--ink-soft); flex-wrap:wrap; gap:10px;}

  /* modal */
  .modal-backdrop{position:fixed; inset:0; background:rgba(10,16,20,.5); display:none; align-items:center; justify-content:center; z-index:100; padding:20px;}
  .modal-backdrop.open{display:flex;}
  .modal{background:var(--surface); border-radius:2px; width:100%; max-width:400px; padding:26px; border:1px solid var(--line); box-shadow:0 8px 24px var(--shadow); max-height:90vh; overflow:auto;}
  .modal-head{display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;}
  .modal-close{border:none; background:none; cursor:pointer; color:var(--ink-soft); padding:4px;}
  .modal .field{margin-bottom:14px;}
  .modal-switch{font-size:.85rem; text-align:center; margin-top:14px; color:var(--ink-soft);}
  .modal-switch button{background:none; border:none; color:var(--accent); font-weight:700; cursor:pointer; padding:0;}

  /* toast */
  #toast{position:fixed; bottom:20px; right:20px; z-index:200; display:flex; flex-direction:column; gap:8px;}
  .toast{background:var(--ink); color:var(--paper); padding:.8em 1.1em; border-radius:2px; font-size:.86rem; box-shadow:0 6px 16px var(--shadow); display:flex; align-items:center; gap:8px; animation:toast-in .18s ease-out;}
  .toast.err{background:var(--danger);}
  @keyframes toast-in{from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:translateY(0);}}

/* ---------- helpers ---------- */
function esc(s){ return String(s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]; }); }
function fmtDate(iso){
  var d=new Date(iso+"T00:00:00");
  return d.toLocaleDateString(state.lang==="uk"?"uk-UA":state.lang, {day:"2-digit",month:"2-digit",year:"numeric"});
}
function navigate(route){ location.hash = route; }
function toast(msg, isErr){
  var el=document.createElement("div");
  el.className="toast"+(isErr?" err":"");
  el.textContent=msg;
  document.getElementById("toast").appendChild(el);
  setTimeout(function(){ el.remove(); }, 3600);
}

/* ---------- filtering ---------- */
function filteredListings(kind){
  return LISTINGS.filter(function(l){
    if(l.kind!==kind) return false;
    if(state.filters.mode!=="all" && l.mode!==state.filters.mode) return false;
    if(state.filters.from && l.from!==state.filters.from) return false;
    if(state.filters.to && l.to!==state.filters.to) return false;
    return true;
  });
}

/* ---------- render: shared bits ---------- */
function cityOptions(selected){
  var html='<option value="">'+esc(t("any"))+'</option>';
  CITIES.forEach(function(c){
    html+='<option value="'+c.id+'"'+(selected===c.id?" selected":"")+'>'+esc(cityName(c.id,state.lang))+'</option>';
  });
  return html;
}
function modeOptions(selected){
  var modes=["all","auto","rail","sea","air","multi"];
  return modes.map(function(m){
    var label = m==="all" ? t("any") : t("mode_"+m);
    return '<option value="'+m+'"'+(selected===m?" selected":"")+'>'+esc(label)+'</option>';
  }).join("");
}

      '<div class="m-sub">'+esc(cargoName(l.cargo,state.lang))+' &middot; '+esc(l.company)+'</div></div>'+
    '<div class="m-figure"><span class="lab">'+esc(t("col_weight"))+'</span>'+l.weight+' t</div>'+
    '<div class="m-figure"><span class="lab">'+esc(t("col_volume"))+'</span>'+l.volume+' m&sup3;</div>'+
    '<div class="m-figure"><span class="lab">'+esc(t("col_date"))+'</span>'+fmtDate(l.date)+'</div>'+
    '<button class="btn btn-sm contact-listing" data-id="'+l.id+'">'+esc(t("contact_btn"))+'</button>'+
  '</div>';
}

function renderResultsSection(kind, title){
  var rows=filteredListings(kind);
  return ''+
  '<section><div class="wrap">'+
    '<div class="section-head"><h2>'+esc(title)+'</h2><span class="eyebrow">'+rows.length+' '+esc(t("results_count"))+'</span></div>'+
    '<div class="filter-bar">'+
      '<div class="field"><label>'+esc(t("f_from"))+'</label><select name="ffrom">'+cityOptions(state.filters.from)+'</select></div>'+
      '<div class="field"><label>'+esc(t("f_to"))+'</label><select name="fto">'+cityOptions(state.filters.to)+'</select></div>'+
      '<div class="field"><label>'+esc(t("f_mode"))+'</label><select name="fmode">'+modeOptions(state.filters.mode)+'</select></div>'+
      '<button class="btn btn-primary" id="applyFilterBtn">'+ICONS.search+esc(t("search"))+'</button>'+
    '</div>'+
    '<div class="manifest">'+
      (rows.length ? rows.map(renderListingRow).join("") : '<div class="empty-state">'+esc(t("results_empty"))+'</div>')+
    '</div>'+
  '</div></section>';
}

/* ---------- render: market ---------- */
function renderMarket(){
  var cards = MARKET.map(function(m){
    var active = state.marketCat===m.id ? " active":"";
    return '<button class="market-card'+active+'" data-market="'+m.id+'">'+ICONS[m.icon]+
      '<div class="mk-title">'+esc(m[state.lang]||m.en)+'</div><div class="mk-count num">'+m.count+'</div></button>';
  }).join("");

  var listingHtml;
  if(state.marketCat){
    var cat = MARKET.filter(function(m){return m.id===state.marketCat;})[0];
    var mock = LISTINGS.slice(0,4).map(function(l,i){
      return '<div class="m-row"><span class="mode-chip auto">'+ICONS[cat.icon]+(cat[state.lang]||cat.en)+'</span>'+
        '<div><div class="m-route">'+esc(cityName(l.from,state.lang))+'</div><div class="m-sub">'+esc(l.company)+'</div></div>'+
        '<div class="m-figure"><span class="lab">'+esc(t("col_price"))+'</span>&euro;'+(l.price+ i*300)+'</div>'+
        '<div></div><div></div>'+
        '<button class="btn btn-sm contact-listing" data-id="'+l.id+'">'+esc(t("contact_btn"))+'</button></div>';
    }).join("");
    listingHtml = '<h3 style="margin-top:28px;">'+esc(t("market_listing_title"))+': '+esc(cat[state.lang]||cat.en)+'</h3><div class="manifest">'+mock+'</div>';
  } else {
    listingHtml = '<p style="margin-top:24px;color:var(--ink-soft);">'+esc(t("market_pick"))+'</p>';
  }

  return ''+
  '<section><div class="wrap">'+
    '<p class="eyebrow">'+esc(t("nav_market"))+'</p>'+
    '<h1>'+esc(t("market_title"))+'</h1><p class="lede">'+esc(t("market_lede"))+'</p>'+
    '<div class="market-grid" style="margin-top:22px;">'+cards+'</div>'+
    listingHtml+
  '</div></section>';
}

/* ---------- render: news ---------- */
function renderNews(){
  var items = NEWS.map(function(n){
    var tr = n[state.lang]||n.en;
    var open = !!state.openNews[n.id];
    return ''+
    '<article class="news-item">'+
      '<div class="n-date">'+fmtDate(n.date)+'</div>'+
      '<h3>'+esc(tr.t)+'</h3>'+
      (open ? '<p class="n-excerpt">'+esc(tr.e)+'</p>' : '')+
      '<button class="btn btn-ghost btn-sm n-more" data-news="'+n.id+'">'+esc(open? t("news_less") : t("news_more"))+'</button>'+
    '</article>';
  }).join("");
  return ''+
  '<section><div class="wrap">'+
    '<p class="eyebrow">'+esc(t("nav_news"))+'</p><h1>'+esc(t("news_title"))+'</h1>'+
    '<div class="news-list">'+items+'</div>'+
  '</div></section>';
}

/* ---------- render: about ---------- */
function renderAbout(){
  var steps=[["step1_t","step1_d"],["step2_t","step2_d"],["step3_t","step3_d"],["step4_t","step4_d"]];
  var stepsHtml = steps.map(function(s,i){
    return '<div class="step-card"><div class="s-num">0'+(i+1)+'</div><h3 style="font-size:1rem;">'+esc(t(s[0]))+'</h3><p style="font-size:.86rem;color:var(--ink-soft);margin:0;">'+esc(t(s[1]))+'</p></div>';
  }).join("");
  return ''+
  '<section><div class="wrap">'+
    '<p class="eyebrow">'+esc(t("nav_about"))+'</p><h1>'+esc(t("about_title"))+'</h1>'+
    '<p class="lede">'+esc(t("about_lede"))+'</p>'+
    '<h2 style="margin-top:30px;font-size:1.2rem;">'+esc(t("about_how"))+'</h2>'+
    '<div class="steps">'+stepsHtml+'</div>'+
    '<div class="info-cards">'+
      '<div class="info-card good"><h3 style="font-size:1rem;">'+esc(t("reliability_t"))+'</h3><p style="margin:0;font-size:.88rem;color:var(--ink-soft);">'+esc(t("reliability_d"))+'</p></div>'+
      '<div class="info-card warn"><h3 style="font-size:1rem;">'+esc(t("blacklist_t"))+'</h3><p style="margin:0;font-size:.88rem;color:var(--ink-soft);">'+esc(t("blacklist_d"))+'</p></div>'+
    '</div>'+
    '<button class="btn btn-primary" id="aboutRegisterBtn" style="margin-top:26px;">'+esc(t("cta_register"))+'</button>'+
  '</div></section>';
}

/* ---------- render: contacts ---------- */
var OFFICES=[
  {city:{uk:"Київ",en:"Kyiv",pl:"Kijów",de:"Kiew"}, addr:"вул. Портова, 12", phone:"+380 44 000 00 00", email:"kyiv@trans-atlas.example"},
  {city:{uk:"Варшава",en:"Warsaw",pl:"Warszawa",de:"Warschau"}, addr:"ul. Transportowa 8", phone:"+48 22 000 00 00", email:"warsaw@trans-atlas.example"},
  {city:{uk:"Гамбург",en:"Hamburg",pl:"Hamburg",de:"Hamburg"}, addr:"Hafenstraße 21", phone:"+49 40 000 00 00", email:"hamburg@trans-atlas.example"}
];
function renderContacts(){
  var offices = OFFICES.map(function(o){
    return '<div class="office"><div class="o-city">'+esc(o.city[state.lang]||o.city.en)+'</div>'+
      '<div class="o-line">'+ICONS.pin+esc(o.addr)+'</div>'+
      '<div class="o-line">'+ICONS.phone+'<a href="tel:'+o.phone.replace(/\s+/g,"")+'">'+esc(o.phone)+'</a></div>'+
      '<div class="o-line">'+ICONS.mail+'<a href="mailto:'+o.email+'">'+esc(o.email)+'</a></div></div>';
  }).join("");
  return ''+
  '<section><div class="wrap">'+
    '<p class="eyebrow">'+esc(t("nav_contacts"))+'</p><h1>'+esc(t("contacts_title"))+'</h1><p class="lede">'+esc(t("contacts_lede"))+'</p>'+
    '<div class="contact-grid" style="margin-top:24px;">'+
      '<form id="contactForm">'+
        '<div class="field" data-field="name"><label>'+esc(t("c_name"))+'</label><input name="name"><div class="field-err">'+esc(t("err_required"))+'</div></div>'+
        '<div class="field" data-field="email"><label>'+esc(t("c_email"))+'</label><input name="email" type="email"><div class="field-err">'+esc(t("err_email"))+'</div></div>'+
        '<div class="field" data-field="message"><label>'+esc(t("c_message"))+'</label><textarea name="message" rows="4"></textarea><div class="field-err">'+esc(t("err_required"))+'</div></div>'+
        '<button type="submit" class="btn btn-primary">'+esc(t("c_send"))+'</button>'+
      '</form>'+
      '<div><h3 style="font-size:.95rem;margin-bottom:12px;">'+esc(t("offices_title"))+'</h3><div class="office-list">'+offices+'</div></div>'+
    '</div>'+
  '</div></section>';
}

/* ---------- page dispatcher ---------- */
function pageContent(){
  switch(state.route){
    case "home": return renderHero()+renderStats();
    case "cargo": return '<div class="wrap" style="padding-top:30px;"><p class="eyebrow">'+esc(t("nav_cargo"))+'</p><h1>'+esc(t("nav_cargo"))+'</h1></div>'+renderResultsSection("cargo", t("results_title"));
    case "transport": return '<div class="wrap" style="padding-top:30px;"><p class="eyebrow">'+esc(t("nav_transport"))+'</p><h1>'+esc(t("nav_transport"))+'</h1></div>'+renderResultsSection("transport", t("results_title"));
    case "market": return renderMarket();
    case "news": return renderNews();
    case "about": return renderAbout();
    case "contacts": return renderContacts();
    default: return renderHero()+renderStats();
  }
}

/* ---------- modal ---------- */
function renderModal(){
  var root=document.getElementById("modalRoot");
  if(!state.modal){ root.className="modal-backdrop"; root.innerHTML=""; return; }
  root.className="modal-backdrop open";
  var isLogin = state.modalMode==="login";
  var extra = isLogin ? "" : ''+
    '<div class="field" data-field="name"><label>'+esc(t("c_name"))+'</label><input name="name"><div class="field-err">'+esc(t("err_required"))+'</div></div>'+
    '<div class="field" data-field="company"><label>'+esc(t("f_companyname"))+'</label><input name="company"><div class="field-err">'+esc(t("err_required"))+'</div></div>';
  var extra2 = isLogin ? "" : ''+
    '<div class="field" data-field="password2"><label>'+esc(t("f_password2"))+'</label><input name="password2" type="password"><div class="field-err">'+esc(t("err_match"))+'</div></div>';

  root.innerHTML = ''+
  '<div class="modal" role="dialog" aria-modal="true">'+
    '<div class="modal-head"><h2 style="margin:0;font-size:1.1rem;">'+esc(isLogin? t("modal_login_title") : t("modal_register_title"))+'</h2>'+
      '<button class="modal-close" id="modalCloseBtn">'+ICONS.close+'</button></div>'+
    '<form id="authForm">'+
      extra+
      '<div class="field" data-field="email"><label>'+esc(t("c_email"))+'</label><input name="email" type="email"><div class="field-err">'+esc(t("err_email"))+'</div></div>'+
      '<div class="field" data-field="password"><label>'+esc(t("f_password"))+'</label><input name="password" type="password"><div class="field-err">'+esc(t("err_pass"))+'</div></div>'+
      extra2+
      '<button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;">'+esc(isLogin? t("submit_login") : t("submit_register"))+'</button>'+
    '</form>'+
    '<div class="modal-switch"><button id="modalSwitchBtn">'+esc(isLogin? t("switch_to_register") : t("switch_to_login"))+'</button></div>'+
  '</div>';

  document.getElementById("modalCloseBtn").onclick=function(){ state.modal=null; renderModal(); };
  root.onclick=function(e){ if(e.target===root){ state.modal=null; renderModal(); } };
  document.getElementById("modalSwitchBtn").onclick=function(){ state.modalMode = isLogin?"register":"login"; renderModal(); };

  document.getElementById("authForm").addEventListener("submit", function(e){
    e.preventDefault();
    var f=e.target;
    var valid=true;
    function markField(name, ok){
      var fieldEl=f.querySelector('[data-field="'+name+'"]');
      if(!fieldEl) return;
      fieldEl.classList.toggle("invalid", !ok);
      if(!ok) valid=false;
    }
    var email=f.email.value.trim();
    var password=f.password.value;
    markField("email", /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email));
    markField("password", password.length>=6);
    if(!isLogin){
      markField("name", f.name.value.trim().length>0);
      markField("company", f.company.value.trim().length>0);
      markField("password2", f.password2.value===password && password.length>=6);
    }
    if(!valid) return;

    if(isLogin){
      var users=getUsers();
      var found=users.filter(function(u){return u.email===email;})[0];
      state.user = found ? {name:found.name, email:email} : {name:email.split("@")[0], email:email};
      saveUser();
      toast(t("toast_login_ok"));
    } else {
      var users2=getUsers();
      users2.push({name:f.name.value.trim(), email:email, company:f.company.value.trim()});
      setUsers(users2);
      state.user = {name:f.name.value.trim(), email:email};
      saveUser();
      toast(t("toast_register_ok"));
    }
    state.modal=null;
    renderModal();
    renderApp();
  });
}

/* ---------- main render ---------- */
function renderApp(){
  document.getElementById("app").innerHTML = renderHeader() + pageContent() + renderFooter();
  bindEvents();
  renderModal();
}

function bindEvents(){
  var app=document.getElementById("app");

  app.querySelectorAll("[data-route]").forEach(function(el){
    el.addEventListener("click", function(ev){
      ev.preventDefault();
      navigate(el.getAttribute("data-route"));
      var navPanel=document.getElementById("primaryNav");
      if(navPanel) navPanel.classList.remove("open");
    });
  });

  app.querySelectorAll("[data-lang]").forEach(function(el){
    el.addEventListener("click", function(){
      state.lang = el.getAttribute("data-lang");
      localStorage.setItem("ta_lang", state.lang);
      renderApp();
    });
  });

  var burger=document.getElementById("burgerBtn");
  if(burger){
    burger.addEventListener("click", function(){
      var nav=document.getElementById("primaryNav");
      var open=nav.classList.toggle("open");
      burger.setAttribute("aria-expanded", open? "true":"false");
    });
  }

  var loginBtn=document.getElementById("loginBtn");
  if(loginBtn) loginBtn.addEventListener("click", function(){ state.modal="auth"; state.modalMode="login"; renderModal(); });
  var registerBtn=document.getElementById("registerBtn");
  if(registerBtn) registerBtn.addEventListener("click", function(){ state.modal="auth"; state.modalMode="register"; renderModal(); });
  var aboutRegisterBtn=document.getElementById("aboutRegisterBtn");
  if(aboutRegisterBtn) aboutRegisterBtn.addEventListener("click", function(){ state.modal="auth"; state.modalMode="register"; renderModal(); });
  var logoutBtn=document.getElementById("logoutBtn");
  if(logoutBtn) logoutBtn.addEventListener("click", function(){ state.user=null; localStorage.removeItem("ta_user"); toast(t("toast_logout_ok")); renderApp(); });

  var heroForm=document.getElementById("heroSearchForm");
  if(heroForm){
    app.querySelectorAll("[data-tab]").forEach(function(b){
      b.addEventListener("click", function(){ state.heroTab=b.getAttribute("data-tab"); renderApp(); });
    });
    heroForm.addEventListener("submit", function(e){
      e.preventDefault();
      var f=e.target;
      state.filters.from=f.from.value; state.filters.to=f.to.value;
      state.filters.mode=f.mode.value; state.filters.date=f.date.value;
      navigate(state.heroTab==="cargo" ? "transport" : "cargo");
    });
    app.querySelectorAll("[data-quickmode]").forEach(function(b){
      b.addEventListener("click", function(){
        state.filters.mode=b.getAttribute("data-quickmode");
        navigate("cargo");
      });
    });
  }

  var applyFilterBtn=document.getElementById("applyFilterBtn");
  if(applyFilterBtn){
    applyFilterBtn.addEventListener("click", function(){
      var bar=applyFilterBtn.closest(".filter-bar");
      state.filters.from=bar.querySelector('[name="ffrom"]').value;
      state.filters.to=bar.querySelector('[name="fto"]').value;
      state.filters.mode=bar.querySelector('[name="fmode"]').value;
      renderApp();
    });
  }

  app.querySelectorAll(".contact-listing").forEach(function(b){
    b.addEventListener("click", function(){
      if(!state.user){ state.modal="auth"; state.modalMode="login"; renderModal(); return; }
      toast(t("results_count")+": #"+b.getAttribute("data-id")+" — "+state.user.email);
    });
  });

  app.querySelectorAll("[data-market]").forEach(function(b){
    b.addEventListener("click", function(){
      var id=b.getAttribute("data-market");
      state.marketCat = state.marketCat===id ? null : id;
      renderApp();
    });
  });

  app.querySelectorAll("[data-widgettab]").forEach(function(b){
    b.addEventListener("click", function(){
      state.homeWidgetTab = b.getAttribute("data-widgettab");
      renderApp();
    });
  });

  app.querySelectorAll("[data-news]").forEach(function(b){
    b.addEventListener("click", function(){
      var id=b.getAttribute("data-news");
      state.openNews[id]=!state.openNews[id];
      renderApp();
    });
  });

  var contactForm=document.getElementById("contactForm");
  if(contactForm){
    contactForm.addEventListener("submit", function(e){
      e.preventDefault();
      var f=e.target;
      var valid=true;
      function markField(name, ok){
        var fieldEl=f.querySelector('[data-field="'+name+'"]');
        fieldEl.classList.toggle("invalid", !ok);
        if(!ok) valid=false;
      }
      markField("name", f.name.value.trim().length>0);
      markField("email", /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(f.email.value.trim()));
      markField("message", f.message.value.trim().length>0);
      if(!valid) return;
      toast(t("c_success"));
      f.reset();
    });
  }
}

/* ---------- boot ---------- */
window.addEventListener("hashchange", function(){
  state.route = (location.hash||"#home").slice(1) || "home";
  window.scrollTo({top:0, behavior:"auto"});
  renderApp();
});
if(!location.hash) location.hash = "#home";
state.route = location.hash.slice(1) || "home";
renderApp();

})();
</script>
</body>
</html>

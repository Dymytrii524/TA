    '<div class="br-sub">UA &rarr; '+esc(countryName(e.countryPair.to))+'</div>'+
    '<span class="status-pill '+e.status+'">'+esc(t("borders_status_"+e.status))+'</span>'+
    '<div><div class="br-queue">'+formatBorderQueue(e)+'</div><div class="borders-source-note">'+esc(sourceLabel)+' &middot; '+minutesAgo(e.updatedAt)+'</div></div>'+
  '</div>';
}

function renderBorders(){
  var b = state.borders;
  var tabs = ["road","rail","sea","asia"].map(function(tb){
    return '<button data-borderstab="'+tb+'" class="'+(b.tab===tb?"active":"")+'">'+esc(t("borders_tab_"+tb))+'</button>';
  }).join("");

  var countryOptions = '<option value="">'+esc(t("directory_all"))+'</option>'+BORDER_COUNTRIES.map(function(c){
    return '<option value="'+c+'"'+(b.country===c?" selected":"")+'>'+esc(countryName(c))+'</option>';
  }).join("");

  var body;
  if(b.tab==="asia"){
    body = '<div class="weather-card"><p class="weather-msg">'+esc(t("borders_asia_notice"))+'</p></div>';
  } else if(b.loading){
    body = '<p class="weather-msg">'+esc(t("borders_loading"))+'</p>';
  } else if(b.error==="offline"){
    body = '<div class="weather-card warn-card"><p class="weather-msg">'+esc(t("borders_offline"))+'</p></div>';
  } else if(b.error){
    body = '<p class="weather-msg">'+esc(t("borders_error"))+'</p>';
  } else if(b.entries && b.entries.length===0){
    body = '<p class="weather-msg">'+esc(t("borders_empty"))+'</p>';
  } else if(b.entries){
    body = (b.partial ? '<p class="weather-msg" style="margin-top:0;">'+esc(t("borders_partial"))+'</p>' : '')+
      '<div class="border-table">'+b.entries.map(renderBorderRow).join("")+'</div>';
  } else {
    body = "";
  }

  var showFilter = b.tab !== "asia";

  return ''+
  '<section><div class="wrap">'+
    '<p class="eyebrow">'+esc(t("nav_market"))+'</p><h1>'+esc(t("borders_title"))+'</h1><p class="lede">'+esc(t("borders_lede"))+'</p>'+
    '<div class="mode-tabs" style="max-width:560px;margin:20px 0 16px;">'+tabs+'</div>'+
    (showFilter ? ''+
      '<div class="filter-bar">'+
        '<div class="field"><label>'+esc(t("borders_country_label"))+'</label><select name="bcountry">'+countryOptions+'</select></div>'+
        '<button class="btn btn-primary" id="bordersApplyBtn">'+ICONS.search+esc(t("borders_apply"))+'</button>'+
      '</div>' : '')+
    body+
  '</div></section>';
}

function pageContent(){
  switch(state.route){
    case "home": return renderHero()+renderStats();
    case "cargo": return '<div class="wrap" style="padding-top:30px;"><p class="eyebrow">'+esc(t("nav_cargo"))+'</p><h1>'+esc(t("nav_cargo"))+'</h1></div>'+renderResultsSection("cargo", t("results_title"));
    case "transport": return '<div class="wrap" style="padding-top:30px;"><p class="eyebrow">'+esc(t("nav_transport"))+'</p><h1>'+esc(t("nav_transport"))+'</h1></div>'+renderResultsSection("transport", t("results_title"));
    case "market": return renderMarket();
    case "news": return renderNews();
    case "about": return renderAbout();
    case "contacts": return renderContacts();
    case "weather": return renderWeather();
    case "directory": return renderDirectory();
    case "borders": return renderBorders();
    case "qa": return renderQa();
    case "rating": return renderRating();
    default: return renderHero()+renderStats();
  }
}

/* ---------- modal ---------- */
function renderModal(){
  var root=document.getElementById("modalRoot");
  if(!state.modal){ root.className="modal-backdrop"; root.innerHTML=""; return; }
  root.className="modal-backdrop open";
  var isLogin = state.modalMode==="login";
  var extra = isLogin ? "" : ''+
    '<div class="field" data-field="name"><label>'+esc(t("c_name"))+'</label><input name="name"><div class="field-err">'+esc(t("err_required"))+'</div></div>'+
    '<div class="field" data-field="company"><label>'+esc(t("f_companyname"))+'</label><input name="company"><div class="field-err">'+esc(t("err_required"))+'</div></div>';
  var extra2 = isLogin ? "" : ''+
    '<div class="field" data-field="password2"><label>'+esc(t("f_password2"))+'</label><input name="password2" type="password"><div class="field-err">'+esc(t("err_match"))+'</div></div>';

  root.innerHTML = ''+
  '<div class="modal" role="dialog" aria-modal="true">'+
    '<div class="modal-head"><h2 style="margin:0;font-size:1.1rem;">'+esc(isLogin? t("modal_login_title") : t("modal_register_title"))+'</h2>'+
      '<button class="modal-close" id="modalCloseBtn">'+ICONS.close+'</button></div>'+
    '<form id="authForm">'+
      extra+
      '<div class="field" data-field="email"><label>'+esc(t("c_email"))+'</label><input name="email" type="email"><div class="field-err">'+esc(t("err_email"))+'</div></div>'+
      '<div class="field" data-field="password"><label>'+esc(t("f_password"))+'</label><input name="password" type="password"><div class="field-err">'+esc(t("err_pass"))+'</div></div>'+
      extra2+
      '<button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;">'+esc(isLogin? t("submit_login") : t("submit_register"))+'</button>'+
    '</form>'+
    '<div class="modal-switch"><button id="modalSwitchBtn">'+esc(isLogin? t("switch_to_register") : t("switch_to_login"))+'</button></div>'+
  '</div>';

  document.getElementById("modalCloseBtn").onclick=function(){ state.modal=null; renderModal(); };
  root.onclick=function(e){ if(e.target===root){ state.modal=null; renderModal(); } };
  document.getElementById("modalSwitchBtn").onclick=function(){ state.modalMode = isLogin?"register":"login"; renderModal(); };

  document.getElementById("authForm").addEventListener("submit", function(e){
    e.preventDefault();
    var f=e.target;
    var valid=true;
    function markField(name, ok){
      var fieldEl=f.querySelector('[data-field="'+name+'"]');
      if(!fieldEl) return;
      fieldEl.classList.toggle("invalid", !ok);
      if(!ok) valid=false;
    }
    var email=f.email.value.trim();
    var password=f.password.value;
    markField("email", /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email));
    markField("password", password.length>=6);
    if(!isLogin){
      markField("name", f.name.value.trim().length>0);
      markField("company", f.company.value.trim().length>0);
      markField("password2", f.password2.value===password && password.length>=6);
    }
    if(!valid) return;

    if(isLogin){
      var users=getUsers();
      var found=users.filter(function(u){return u.email===email;})[0];
      state.user = found ? {name:found.name, email:email} : {name:email.split("@")[0], email:email};
      saveUser();
      toast(t("toast_login_ok"));
    } else {
      var users2=getUsers();
      users2.push({name:f.name.value.trim(), email:email, company:f.company.value.trim()});
      setUsers(users2);
      state.user = {name:f.name.value.trim(), email:email};
      saveUser();
      toast(t("toast_register_ok"));
    }
    state.modal=null;
    renderModal();
    renderApp();
  });
}

/* ---------- main render ---------- */
function renderApp(){
  document.documentElement.lang = state.lang;
  document.documentElement.dir = isRtl() ? "rtl" : "ltr";
  document.getElementById("app").innerHTML = renderHeader() + pageContent() + renderFooter();
  bindEvents();
  renderModal();
}

function bindEvents(){
  var app=document.getElementById("app");

  app.querySelectorAll("[data-route]").forEach(function(el){
    el.addEventListener("click", function(ev){
      ev.preventDefault();
      navigate(el.getAttribute("data-route"));
      var navPanel=document.getElementById("primaryNav");
      if(navPanel) navPanel.classList.remove("open");
    });
  });

  app.querySelectorAll("[data-lang]").forEach(function(el){
    el.addEventListener("click", function(){
      state.lang = el.getAttribute("data-lang");
      localStorage.setItem("ta_lang", state.lang);
      renderApp();
    });
  });

  var burger=document.getElementById("burgerBtn");
  if(burger){
    burger.addEventListener("click", function(){
      var nav=document.getElementById("primaryNav");
      var open=nav.classList.toggle("open");
      burger.setAttribute("aria-expanded", open? "true":"false");
    });
  }

  var loginBtn=document.getElementById("loginBtn");
  if(loginBtn) loginBtn.addEventListener("click", function(){ state.modal="auth"; state.modalMode="login"; renderModal(); });
  var registerBtn=document.getElementById("registerBtn");
  if(registerBtn) registerBtn.addEventListener("click", function(){ state.modal="auth"; state.modalMode="register"; renderModal(); });
  var aboutRegisterBtn=document.getElementById("aboutRegisterBtn");
  if(aboutRegisterBtn) aboutRegisterBtn.addEventListener("click", function(){ state.modal="auth"; state.modalMode="register"; renderModal(); });
  var logoutBtn=document.getElementById("logoutBtn");
  if(logoutBtn) logoutBtn.addEventListener("click", function(){ state.user=null; localStorage.removeItem("ta_user"); toast(t("toast_logout_ok")); renderApp(); });

  // Two independent stacked search panels now sit where one tab-switched
  // form used to (see heroSearchForm() in renderHero) - each just submits
  // to its own fixed destination route instead of a shared heroTab toggle.
  function bindHeroForm(formId, targetRoute){
    var form = document.getElementById(formId);
    if(!form) return;
    form.addEventListener("submit", function(e){
      e.preventDefault();
      var f=e.target;
      state.filters.from=f.from.value; state.filters.to=f.to.value;
      state.filters.mode=f.mode.value; state.filters.date=f.date.value;
      state.filters.multiModes = f.mode.value==="multi" ? readMultiModes(f,"mode") : [];
      state.filters.fromCountry = ""; state.filters.toCountry = ""; state.filters.borderScope = "";
      navigate(targetRoute);
    });
  }
  bindHeroForm("heroFormCargo", "transport");
  bindHeroForm("heroFormTransport", "cargo");
  app.querySelectorAll("[data-quickmode]").forEach(function(b){
    b.addEventListener("click", function(){
      state.filters.mode=b.getAttribute("data-quickmode");
      state.filters.fromCountry = ""; state.filters.toCountry = ""; state.filters.borderScope = "";
      navigate("cargo");
    });
  });

  app.querySelectorAll(".mode-select").forEach(function(sel){
    sel.addEventListener("change", function(){
      var panel = sel.parentElement.querySelector("[data-modesub]");
      if(panel) panel.style.display = sel.value==="multi" ? "flex" : "none";
    });
  });

  var applyFilterBtn=document.getElementById("applyFilterBtn");
  if(applyFilterBtn){
    applyFilterBtn.addEventListener("click", function(){
      var bar=applyFilterBtn.closest(".filter-bar");
      state.filters.from=bar.querySelector('[name="ffrom"]').value;
      state.filters.to=bar.querySelector('[name="fto"]').value;
      var modeVal=bar.querySelector('[name="fmode"]').value;
      state.filters.mode=modeVal;
      state.filters.multiModes = modeVal==="multi" ? readMultiModes(bar,"fmode") : [];
      var currencyEl = bar.querySelector('[name="fcurrency"]');
      state.filters.currency = currencyEl ? currencyEl.value : "";
      // Picking specific cities here supersedes any country-level scope a
      // flow-table number click (see renderFlowNum) may have set earlier.
      state.filters.fromCountry = ""; state.filters.toCountry = ""; state.filters.borderScope = "";
      renderApp();
    });
  }

  app.querySelectorAll(".contact-listing").forEach(function(b){
    b.addEventListener("click", function(){
      if(!state.user){ state.modal="auth"; state.modalMode="login"; renderModal(); return; }
      toast(t("results_count")+": #"+b.getAttribute("data-id")+" — "+state.user.email);
    });
  });

  // Per-listing Сервіси icons (see renderListingRow) - Довідник/Карта use
  // the generic [data-route] handler above since they need no context, but
  // Кордони/Погода carry this specific listing's route and jump straight to
  // the matching real data instead of a blank service page.
  app.querySelectorAll(".m-svc-borders").forEach(function(a){
    a.addEventListener("click", function(e){
      e.preventDefault();
      state.borders.country = a.getAttribute("data-country") || "";
      state.borders.entries = null; state.borders.error = null;
      navigate("borders");
    });
  });
  app.querySelectorAll(".m-svc-weather").forEach(function(a){
    a.addEventListener("click", function(e){
      e.preventDefault();
      var fromId = a.getAttribute("data-from"), toId = a.getAttribute("data-to");
      state.weather.from = fromId; state.weather.to = toId;
      navigate("weather");
      fetchWeatherForRoute(fromId, toId);
    });
  });

  app.querySelectorAll("[data-market]").forEach(function(b){
    b.addEventListener("click", function(){
      var id=b.getAttribute("data-market");
      state.marketCat = state.marketCat===id ? null : id;
      renderApp();
    });
  });
  app.querySelectorAll("[data-marketmode]").forEach(function(b){
    b.addEventListener("click", function(){
      state.marketMode = b.getAttribute("data-marketmode");
      state.marketCat = null;
      renderApp();
    });
  });
  app.querySelectorAll("[data-markethome]").forEach(function(a){
    a.addEventListener("click", function(e){
      e.preventDefault();
      state.marketMode = "auto";
      state.marketCat = a.getAttribute("data-markethome");
      navigate("market");
    });
  });


  app.querySelectorAll("[data-weathertab]").forEach(function(b){
    b.addEventListener("click", function(){
      state.weather.tab = b.getAttribute("data-weathertab");
      renderApp();
    });
  });
  var weatherShowBtn=document.getElementById("weatherShowBtn");
  if(weatherShowBtn){
    weatherShowBtn.addEventListener("click", function(){
      var bar=weatherShowBtn.closest(".filter-bar");
      var fromId=bar.querySelector('[name="wfrom"]').value;
      var toId=bar.querySelector('[name="wto"]').value;
      state.weather.from=fromId; state.weather.to=toId;
      if(!fromId || !toId){ state.weather.points=null; state.weather.error=null; renderApp(); return; }
      fetchWeatherForRoute(fromId, toId);
    });
  }

  var directoryApplyBtn=document.getElementById("directoryApplyBtn");
  if(directoryApplyBtn){
    directoryApplyBtn.addEventListener("click", function(){
      var bar=directoryApplyBtn.closest(".filter-bar");
      state.directory.transport=bar.querySelector('[name="dtransport"]').value;
      state.directory.region=bar.querySelector('[name="dregion"]').value;
      state.directory.q=bar.querySelector('[name="dq"]').value;
      fetchDirectory();
    });
  }
  if(state.route==="directory" && state.directory.entries===null && !state.directory.loading && !state.directory.error){
    fetchDirectory();
  }

  app.querySelectorAll("[data-borderstab]").forEach(function(b){
    b.addEventListener("click", function(){
      state.borders.tab = b.getAttribute("data-borderstab");
      state.borders.entries = null; state.borders.error = null;
      renderApp();
    });
  });

  app.querySelectorAll("[data-flowcontinent]").forEach(function(b){
    b.addEventListener("click", function(){
      var key = b.getAttribute("data-flowtarget")==="intl" ? "intlContinent" : "domesticContinent";
      state.flows[key] = b.getAttribute("data-flowcontinent");
      renderApp();
    });
  });

  app.querySelectorAll("[data-flowcountry]").forEach(function(b){
    b.addEventListener("click", function(){
      var country = b.getAttribute("data-flowcountry");
      var dir = b.getAttribute("data-flowdir");
      state.filters.from = ""; state.filters.to = "";
      state.filters.fromCountry = dir==="export" ? country : "";
      state.filters.toCountry = dir==="import" ? country : "";
      state.filters.borderScope = b.getAttribute("data-flowscope");
      state.filters.mode = "all"; state.filters.multiModes = [];
      navigate(b.getAttribute("data-flowroute"));
    });
  });
  var bordersApplyBtn=document.getElementById("bordersApplyBtn");
  if(bordersApplyBtn){
    bordersApplyBtn.addEventListener("click", function(){
      var bar=bordersApplyBtn.closest(".filter-bar");
      state.borders.country=bar.querySelector('[name="bcountry"]').value;
      fetchBorders();
    });
  }
  if(state.route==="borders" && state.borders.tab!=="asia" && state.borders.entries===null && !state.borders.loading && !state.borders.error){
    fetchBorders();
  }

  app.querySelectorAll("[data-qacat]").forEach(function(b){
    b.addEventListener("click", function(){
      state.qa.wikiCategory = b.getAttribute("data-qacat");
      fetchQaWiki();
    });
  });
  var qaWikiSearch = document.getElementById("qaWikiSearch");
  if(qaWikiSearch){
    // Full-app re-renders on state change would drop keyboard focus if this
    // fired on every "input" event - trigger only when the user is done
    // typing (blur) or presses Enter, same as the directory/borders filters
    // that submit on an explicit Apply action rather than live per-keystroke.
    qaWikiSearch.addEventListener("keydown", function(e){
      if(e.key==="Enter"){ e.preventDefault(); state.qa.wikiQuery = qaWikiSearch.value; fetchQaWiki(); }
    });
    qaWikiSearch.addEventListener("blur", function(){
      if(qaWikiSearch.value !== state.qa.wikiQuery){ state.qa.wikiQuery = qaWikiSearch.value; fetchQaWiki(); }
    });
  }
  app.querySelectorAll("[data-qaarticle]").forEach(function(b){
    b.addEventListener("click", function(){
      var id = b.getAttribute("data-qaarticle");
      state.qa.openArticles[id] = !state.qa.openArticles[id];
      renderApp();
    });
  });
  var qaAskForm = document.getElementById("qaAskForm");
  if(qaAskForm){
    qaAskForm.addEventListener("submit", function(e){
      e.preventDefault();
      var q = qaAskForm.qaQuestion.value.trim();
      if(!q || state.qa.asking) return;
      qaAskForm.qaQuestion.value = "";
      askQa(q);
    });
  }
  var qaNotFoundForm = document.getElementById("qaNotFoundForm");
  if(qaNotFoundForm){
    qaNotFoundForm.addEventListener("submit", function(e){
      e.preventDefault();
      var text = qaNotFoundForm.qaNotFoundText.value.trim();
      if(!text) return;
      var inbox = JSON.parse(localStorage.getItem("ta_qa_inbox")||"[]");
      inbox.push({text:text, at:new Date().toISOString()});
      localStorage.setItem("ta_qa_inbox", JSON.stringify(inbox));
      state.qa.notFoundSent = true;
      renderApp();
    });
  }
  if(state.route==="qa"){
    if(state.qa.wiki===null && !state.qa.wikiLoading && !state.qa.wikiError) fetchQaWiki();
    if(state.qa.outputs===null && !state.qa.outputsLoading && !state.qa.outputsError) fetchQaOutputs();
    if(state.qa.wikiById===null && !state.qa.wikiByIdLoading && !state.qa.wikiByIdError) fetchQaWikiAll();
  }

  app.querySelectorAll("[data-term-wiki]").forEach(function(el){
    el.addEventListener("click", function(){
      state.qa.activeTerm = { label: el.getAttribute("data-term-label"), wikiId: el.getAttribute("data-term-wiki") };
      renderApp();
      var panel = document.getElementById("qaGlossaryPanel");
      if(panel) panel.scrollIntoView({behavior:"smooth", block:"nearest"});
    });
  });
  app.querySelectorAll("[data-qaopenarticle]").forEach(function(b){
    b.addEventListener("click", function(){
      var id = b.getAttribute("data-qaopenarticle");
      state.qa.wikiCategory = ""; state.qa.wikiQuery = "";
      state.qa.openArticles[id] = true;
      fetchQaWiki();
      var col = document.getElementById("qaWikiCol");
      if(col) col.scrollIntoView({behavior:"smooth", block:"start"});
    });
  });

  app.querySelectorAll("[data-news]").forEach(function(b){
    b.addEventListener("click", function(){
      var id=b.getAttribute("data-news");
      state.openNews[id]=!state.openNews[id];
      renderApp();
    });
  });

  var contactForm=document.getElementById("contactForm");
  if(contactForm){
    contactForm.addEventListener("submit", function(e){
      e.preventDefault();
      var f=e.target;
      var valid=true;
      function markField(name, ok){
        var fieldEl=f.querySelector('[data-field="'+name+'"]');
        fieldEl.classList.toggle("invalid", !ok);
        if(!ok) valid=false;
      }
      markField("name", f.name.value.trim().length>0);
      markField("email", /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(f.email.value.trim()));
      markField("message", f.message.value.trim().length>0);
      if(!valid) return;
      toast(t("c_success"));
      f.reset();
    });
  }
}

/* ---------- boot ---------- */
window.addEventListener("hashchange", function(){
  state.route = (location.hash||"#home").slice(1) || "home";
  window.scrollTo({top:0, behavior:"auto"});
  renderApp();
});
if(!location.hash) location.hash = "#home";
state.route = location.hash.slice(1) || "home";
renderApp();

})();
</script>
</body>
</html>

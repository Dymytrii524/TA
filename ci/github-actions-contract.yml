# Крок «Контракт» ТЗ, розділ A.13.2. Обовʼязковий для кожного pull request,
# що торкається ТЗ, схеми або самого прогону. Не потребує ні бази, ні застосунку.
name: contract

on:
  # Фільтра paths тут навмисно немає: обовʼязкова перевірка мусить зʼявлятися
  # в кожному pull request, інакше злиття блокується назавжди (розділ A.13.4 ТЗ).
  # Економія часу забезпечується кроком «Чи торкнувся PR контракту» нижче.
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: contract-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  schema:
    name: Схема і сценарії T16-T27
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Чи торкнувся PR контракту
        id: changed
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          base="origin/${{ github.base_ref }}"
          git fetch origin "${{ github.base_ref }}" --quiet
          if git diff --name-only "$base"...HEAD | grep -Eq '^(ТЗ-алгоритм-пошуку-вантажів-і-маршрутів\.md|ТЗ-рамкове-логістична-біржа\.md|schemas/|i18n/|ci/)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Контракт не змінювався — прогін пропускається, перевірка вважається успішною."
          fi

      - uses: actions/setup-python@v5
        if: steps.changed.outputs.run == 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: schemas/requirements.txt

      - name: Встановити залежності
        if: steps.changed.outputs.run == 'true'
        run: pip install -r schemas/requirements.txt

      - name: Валідність самої схеми
        if: steps.changed.outputs.run == 'true'
        run: |
          python schemas/validate_schema.py
          echo "схема валідна, \$id = $(python ci/schema_id.py)"

      - name: Узгодженість правила гілки з конвеєром
        if: steps.changed.outputs.run == 'true'
        run: python ci/check_ruleset.py

      - name: Приклади 8.4.1, мутації та програмні перевірки
        if: steps.changed.outputs.run == 'true'
        run: python schemas/check_schema.py | tee contract-report.txt

      - name: Звіт у підсумок pull request
        if: always() && steps.changed.outputs.run == 'true'
        run: |
          {
            echo "## Крок «Контракт»"
            echo '```'
            cat contract-report.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Попередження про зміну схеми без зміни ідентифікатора версії
        if: github.event_name == 'pull_request' && steps.changed.outputs.run == 'true'
        run: |
          git fetch --depth=1 origin "${{ github.base_ref }}"
          base="origin/${{ github.base_ref }}:schemas/post-drone.schema.json"
          git show "$base" > /tmp/schema-before.json 2>/dev/null || echo '{}' > /tmp/schema-before.json
          if ! cmp -s /tmp/schema-before.json schemas/post-drone.schema.json \
             && [ "$(python ci/schema_id.py /tmp/schema-before.json)" = "$(python ci/schema_id.py)" ]; then
            echo "::warning::Схему змінено, ідентифікатор версії не змінився. Перевірте сумісність за розділом A.13.6 ТЗ."
          fi

      - uses: actions/upload-artifact@v4
        if: always() && steps.changed.outputs.run == 'true'
        with:
          name: contract-report
          path: contract-report.txt

  i18n:
    name: Валютні та мовні сценарії C1-C9, L1-L6
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Чи торкнувся PR валютної або мовної моделі
        id: changed
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          base="origin/${{ github.base_ref }}"
          git fetch origin "${{ github.base_ref }}" --quiet
          if git diff --name-only "$base"...HEAD | grep -Eq '^(ТЗ-алгоритм-пошуку-вантажів-і-маршрутів\.md|ТЗ-рамкове-логістична-біржа\.md|schemas/|i18n/|ci/)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Валютна й мовна моделі не змінювалися - прогін пропускається, перевірка вважається успішною."
          fi

      - uses: actions/setup-python@v5
        if: steps.changed.outputs.run == 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: schemas/requirements.txt

      - name: Встановити залежності
        if: steps.changed.outputs.run == 'true'
        run: pip install -r schemas/requirements.txt

      - name: Валідність схеми фікстур
        if: steps.changed.outputs.run == 'true'
        run: python schemas/validate_schema.py schemas/i18n.schema.json

      - name: Сценарії C1-C9 і L1-L6 з мутаціями
        if: steps.changed.outputs.run == 'true'
        run: python schemas/check_i18n.py | tee i18n-report.txt

      - name: Звіт у підсумок pull request
        if: always() && steps.changed.outputs.run == 'true'
        run: |
          {
            echo "## Валютні та мовні сценарії"
            echo '```'
            cat i18n-report.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always() && steps.changed.outputs.run == 'true'
        with:
          name: i18n-report
          path: i18n-report.txt

  # Саме цю перевірку призначають обовʼязковою в правилах гілки.
  # Вона виконується завжди й падає, якщо впав будь-який із job «schema» або «i18n».
  contract-gate:
    name: contract-gate
    needs: [schema, i18n]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Результат кроку «Контракт»
        run: |
          rc=0
          for pair in "schema:${{ needs.schema.result }}" "i18n:${{ needs.i18n.result }}"; do
            job="${pair%%:*}"; result="${pair#*:}"
            echo "job $job: $result"
            case "$result" in
              success|skipped) ;;
              *) echo "::error::Job $job не пройдено ($result). Див. розділи A.13.2-A.13.3, 13.6 і 14.7 ТЗ."; rc=1 ;;
            esac
          done
          if [ "$rc" -eq 0 ]; then echo "перевірка пройдена"; fi
          exit "$rc"

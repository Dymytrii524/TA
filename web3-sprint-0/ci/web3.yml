# Proposed additive workflow. Copy to .github/workflows/web3.yml only after review.
# Existing checks/ruleset remain unchanged. No path filter, secrets or deployment.
name: Web3 Sprint 0
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
defaults:
  run:
    shell: bash -euo pipefail {0}
    working-directory: web3-sprint-0
jobs:
  web3-tests:
    name: web3-sprint0-tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Pinned dependencies
        run: |
          npm ci --ignore-scripts
          npm audit --audit-level=moderate
          python -m pip install -r requirements.txt
      - name: Unit, fuzz, invariants and negative mutations
        env:
          FOUNDRY_PROFILE: ci
        run: |
          node tools/foundry.mjs forge test -vv
          python tools/mutations.py
      - name: SQL and API contracts
        run: |
          node tests/db.test.mjs
          node tests/db-p1.test.mjs
          node tests/db-p2.test.mjs
          python tools/check_api.py
          node tests/amoy-config.test.mjs
      - name: Local EVM integration
        run: |
          node tools/foundry.mjs anvil --host 127.0.0.1 --port 8545 --chain-id 31337 --silent &
          anvil_pid=$!
          trap 'kill "$anvil_pid" || true' EXIT
          node tools/wait_rpc.mjs
          node tests/integration.test.mjs
  blockchain-gate:
    name: blockchain-gate
    needs: [web3-tests]
    if: always()
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - name: Fail closed including skipped or cancelled tests
        env:
          RESULT: ${{ needs.web3-tests.result }}
        run: test "$RESULT" = success

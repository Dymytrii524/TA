// Модуль SEARCH — пошук маршрутів (S4–S7) і контракт модуля POST_DRONE.
//
// Нормативні джерела:
//   A.6  — основний алгоритм за блок-схемою № 3.1.1
//   A.7  — ранжування та процедура впорядкування видачі
//   A.8.3 — POST /api/v1/search/routes
//   A.8.4 — контракт модуля POST_DRONE (рисунок 3.1.1-7)
//   A.11 — нефункціональні вимоги, бюджет POST_DRONE
//   schemas/post-drone.schema.json — нормативна машинна перевірка дрон-частини

syntax = "proto3";

package transatlas.search.v1;

import "buf/validate/validate.proto";
import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";
import "transatlas/search/v1/common.proto";

option go_package = "github.com/trans-atlas/search/gen/transatlas/search/v1;searchv1";
option java_multiple_files = true;
option java_package = "net.transatlas.search.v1";

// ---------------------------------------------------------------------------
// Запит (A.8.3)
// ---------------------------------------------------------------------------

// Критерій ранжування. Задає набір ваг w у формулі S(R) (A.7).
enum RankCriterion {
  RANK_CRITERION_UNSPECIFIED = 0;
  RANK_CRITERION_COST = 1 [(wire) = "cost"];
  RANK_CRITERION_TIME = 2 [(wire) = "time"];
  RANK_CRITERION_BALANCED = 3 [(wire) = "balanced"];
}

// Блок `drone` запиту (A.8.4).
message DroneOptions {
  // Вимкнення модуля без зміни `modes`.
  // Дефолт: true, якщо TRANSPORT_MODE_DRONE присутній у `modes`.
  // proto3 optional дає розрізнення «не задано» і «явно false»: без нього
  // явне вимкнення модуля не відрізнити від відсутнього блоку.
  optional bool allow = 1;

  // Дозвіл на четверте плече через підстановку площадки (ворота 5).
  // Дефолт true. При false і відсутності прямого лота X → П2 модуль
  // зупиняється з кодом extra_leg_disabled.
  optional bool allow_extra_leg = 2;

  // Повернути результат кожних воріт. Дефолт false.
  // При false поле `drone_diagnostics` у відповіді ВІДСУТНЄ (не порожнє).
  optional bool diagnostics = 3;
}

message RadiusKm {
  double origin = 1 [
    (buf.validate.field).double.gte = 0,
    (buf.validate.field).double.lte = 800
  ];
  double destination = 2 [
    (buf.validate.field).double.gte = 0,
    (buf.validate.field).double.lte = 800
  ];
}

message SearchRoutesRequest {
  option (buf.validate.message).cel = {
    id: "search_routes.depart_window"
    message: "depart_to не може бути раніше depart_from"
    expression: "this.depart_to == '' || this.depart_to >= this.depart_from"
  };
  option (buf.validate.message).cel = {
    id: "search_routes.transships_vs_legs"
    message: "max_transships не може перевищувати max_legs − 1 (A.10)"
    expression: "this.max_transships == 0 || this.max_transships <= 3"
  };
  option (buf.validate.message).cel = {
    id: "search_routes.leg_mode_not_multimodal"
    message: "TRANSPORT_MODE_MULTIMODAL — розділ біржі, а не вид плеча (A.3.1)"
    expression: "!this.modes.exists(m, m == 6)"
  };

  // P1 (A.3.2). Обов'язковий.
  PlaceQuery origin = 1 [(buf.validate.field).required = true];

  // P2 (A.3.2). Обов'язковий.
  PlaceQuery destination = 2 [(buf.validate.field).required = true];

  // Tin1 — вікно відправлення, ISO-8601 дата. `depart_from` обов'язковий.
  string depart_from = 3 [(buf.validate.field).string.pattern = "^\\d{4}-\\d{2}-\\d{2}$"];
  string depart_to = 4 [(buf.validate.field).string.pattern = "^(\\d{4}-\\d{2}-\\d{2})?$"];

  // Tout1 — крайній час прибуття. Необов'язковий.
  string arrive_by = 5 [(buf.validate.field).string.pattern = "^(\\d{4}-\\d{2}-\\d{2})?$"];

  // Vaga — вага в тоннах, завжди в тоннах, у тому числі для дронів.
  // Дрон-плече віддає вантажопідйомність у кілограмах окремим полем
  // `Leg.payload_kg`; перерахунок робить модуль, а не клієнт (див. README,
  // розбіжність D-2).
  double weight_t = 6 [(buf.validate.field).double.gt = 0];

  // Scope — об'єм, м³.
  double volume_m3 = 7 [(buf.validate.field).double.gte = 0];

  Dimensions dims = 8;

  // Тип вантажу зі списку розділу, з можливістю вводу з клавіатури.
  string cargo_type = 9;

  // Клас небезпеки 1–9. 0 = не задано.
  uint32 adr = 10 [(buf.validate.field).uint32.lte = 9];

  // Дозволені види транспорту. Порожній список = усі оплачені розділи
  // (SearchContext.paid_modes).
  repeated TransportMode modes = 11 [(buf.validate.field).repeated = {
    unique: true
    items: {enum: {defined_only: true}}
  }];

  RankCriterion criterion = 12 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];

  // Максимум перевантажень. 0 = взяти дефолт адміністратора (A.10, дефолт 2).
  uint32 max_transships = 13 [(buf.validate.field).uint32.lte = 3];

  // Радіус пошуку проміжних пунктів. Не задано = дефолт адміністратора.
  RadiusKm radius_km = 14;

  // Мінімальний рейтинг компанії-перевізника.
  double min_rating = 15 [
    (buf.validate.field).double.gte = 0,
    (buf.validate.field).double.lte = 5
  ];

  DroneOptions drone = 16;

  SearchContext context = 17;
}

// ---------------------------------------------------------------------------
// Маршрут і плече
// ---------------------------------------------------------------------------

// Походження варіанта. Відрізняє додані модулем POST_DRONE варіанти від
// варіантів гілок блок-схеми (правило 2 розділу A.8.4).
enum RouteOrigin {
  ROUTE_ORIGIN_UNSPECIFIED = 0;
  ROUTE_ORIGIN_BRANCH = 1 [(wire) = "branch"];
  ROUTE_ORIGIN_POST_DRONE = 2 [(wire) = "post_drone"];
}

// Прапорці-попередження (A.7). Не є причиною відмови: варіант присутній у
// видачі й отримує штраф p_j до скора.
enum RouteWarning {
  ROUTE_WARNING_UNSPECIFIED = 0;
  ROUTE_WARNING_WEATHER_RISK = 1 [(wire) = "weather_risk"];
  ROUTE_WARNING_NO_PERMIT = 2 [(wire) = "no_permit"];
  ROUTE_WARNING_CUSTOMS_MISSING = 3 [(wire) = "customs_missing"];
  ROUTE_WARNING_LOW_RATING = 4 [(wire) = "low_rating"];
  ROUTE_WARNING_BLACKLISTED = 5 [(wire) = "blacklisted"];
  ROUTE_WARNING_ESTIMATED_PRICE = 6 [(wire) = "estimated_price"];
}

// Стан перевірки погоди у дрон-плечі (ворота 6).
//
// У JSON-контракті це поле `weather.ok` типу boolean|null. proto3 не має null
// у скалярі, тому тристан подано enum:
//   true  -> WEATHER_STATUS_OK
//   false -> WEATHER_STATUS_EXCEEDED
//   null  -> WEATHER_STATUS_UNAVAILABLE
// Заборонено підставляти вигадані значення: при UNAVAILABLE `wind_ms` не
// заповнюється, `source_error` обов'язковий, а у відповіді `partial = true`
// (НФВ «чесність даних», A.11).
enum WeatherStatus {
  WEATHER_STATUS_UNSPECIFIED = 0;
  WEATHER_STATUS_OK = 1;
  WEATHER_STATUS_EXCEEDED = 2;
  WEATHER_STATUS_UNAVAILABLE = 3;
}

message Weather {
  option (buf.validate.message).cel = {
    id: "weather.unavailable_requires_error"
    message: "при недоступному сервісі погоди обов'язковий source_error і порожній wind_ms"
    expression:
      "this.status != 3 || (this.source_error != '' && !has(this.wind_ms))"
  };
  option (buf.validate.message).cel = {
    id: "weather.known_requires_wind"
    message: "при відомому стані погоди wind_ms обов'язковий"
    expression: "this.status != 1 && this.status != 2 || has(this.wind_ms)"
  };

  WeatherStatus status = 1 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];

  // Фактичний вітер, м/с. Presence обов'язкове: «0 м/с» і «немає даних» —
  // різні стани.
  optional double wind_ms = 2 [(buf.validate.field).double.gte = 0];

  // Порог `drone_wind_limit_ms` (A.10, дефолт 12).
  double limit_ms = 3 [(buf.validate.field).double.gt = 0];

  // Текст помилки джерела. Заповнюється лише при UNAVAILABLE.
  string source_error = 4;
}

message Leg {
  option (buf.validate.message).cel = {
    id: "leg.drone_fields_only_for_drone"
    message: "range_used_km, payload_kg і weather допустимі лише у плечі mode=D"
    expression:
      "this.mode == 5 || (!has(this.range_used_km) && !has(this.payload_kg) && !has(this.weather))"
  };
  option (buf.validate.message).cel = {
    id: "leg.drone_requires_gates"
    message: "дрон-плече зобов'язане містити range_used_km, payload_kg і weather (ворота 3, 4, 6)"
    expression:
      "this.mode != 5 || (has(this.range_used_km) && has(this.payload_kg) && has(this.weather))"
  };

  TransportMode mode = 1 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [
      0,
      6
    ]
  }];

  Point from = 2 [(buf.validate.field).required = true];
  Point to = 3 [(buf.validate.field).required = true];

  // Заявка (лот), до якої прив'язане плече. Кожне плече маршруту прив'язане до
  // реальної активної заявки (A.3.3, клас відповіді 1).
  int64 lot_id = 4 [(buf.validate.field).int64.gt = 0];

  google.protobuf.Timestamp depart = 5;
  google.protobuf.Timestamp arrive = 6;

  Company company = 7;

  // Нормалізована вартість плеча C_i у базовій валюті — величина ранжування,
  // не ціна для показу (див. common.proto).
  double cost_base = 8 [(buf.validate.field).double.gte = 0];

  // false — ні фрахту в лоті, ні медіани в link_stats: плече не бере участі в
  // сортуванні за критерієм cost (A.5).
  bool cost_known = 9;

  // Транзитний час плеча t_i, годин.
  double transit_hours = 10 [(buf.validate.field).double.gte = 0];

  // Документи плеча: CMR, T1, TIR тощо.
  repeated string customs = 11;

  // --- поля дрон-плеча (mode = TRANSPORT_MODE_DRONE) -----------------------
  // У JSON-контракті вони лежать плоско на об'єкті плеча, тому тут теж плоско,
  // а не у вкладеному message: інакше JSON-подання розійшлося б зі схемою.

  // Фактично використана дальність, км. Ворота 3 порівнюють її з
  // range_km × drone_range_margin (A.4.5).
  optional double range_used_km = 20 [(buf.validate.field).double.gt = 0];

  // Вантажопідйомність дрон-плеча, КІЛОГРАМИ (A.4.5 max_payload_kg).
  optional double payload_kg = 21 [(buf.validate.field).double.gt = 0];

  // Дозвіл конкретного лота (lots.params.flight_permit). Порожній рядок —
  // дозволу немає: це додає попередження no_permit, але НЕ відсіває варіант.
  // Не плутати з воротами 2, які перевіряють зону П2 і зупиняють модуль.
  string permit_id = 22;

  optional Weather weather = 23;
}

message Route {
  option (buf.validate.message).cel = {
    id: "route.variant_of_iff_post_drone"
    message: "variant_of обов'язковий у дрон-варіанта і заборонений у варіанта гілки (правило 2, A.8.4)"
    expression:
      "this.origin == 2 ? has(this.variant_of) : !has(this.variant_of)"
  };
  option (buf.validate.message).cel = {
    id: "route.pin_only_for_post_drone"
    message: "order_pinned_below допустиме лише у дрон-варіанта і мусить дорівнювати variant_of (A.7)"
    expression:
      "!has(this.order_pinned_below) || (this.origin == 2 && has(this.variant_of) && this.order_pinned_below == this.variant_of)"
  };
  option (buf.validate.message).cel = {
    id: "route.weather_risk_requires_pin"
    message: "дрон-варіант із weather_risk зобов'язаний мати order_pinned_below (правило 3, A.8.4)"
    expression:
      "!(this.origin == 2 && this.warnings.exists(w, w == 1)) || has(this.order_pinned_below)"
  };
  option (buf.validate.message).cel = {
    id: "route.drone_variant_id_suffix"
    message: "route_id дрон-варіанта має суфікс _d, варіант гілки — не має"
    expression:
      "this.origin == 2 ? this.route_id.endsWith('_d') : !this.route_id.endsWith('_d')"
  };
  option (buf.validate.message).cel = {
    id: "route.last_leg_drone_iff_post_drone"
    message: "дрон-варіант зобов'язаний завершуватися плечем D, варіант гілки — ні"
    expression:
      "this.legs.size() == 0 || (this.origin == 2) == (this.legs[this.legs.size() - 1].mode == 5)"
  };

  // Конвенція іменування: rt_<id> для варіанта гілки, rt_<id>_d для
  // дрон-варіанта. Патерн збігається з $defs.route_id JSON Schema.
  string route_id = 1 [(buf.validate.field).string.pattern = "^rt_[A-Za-z0-9]+(_d)?$"];

  RouteOrigin origin = 2 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];

  // Батьківський маршрут гілки. Заповнене ЛИШЕ у дрон-варіанта.
  optional string variant_of = 3 [(buf.validate.field).string.pattern = "^rt_[A-Za-z0-9]+$"];

  // Жорстке обмеження порядку (A.7, крок 4): варіант стоїть у `routes` після
  // вказаного маршруту навіть за меншого score. Дорівнює `variant_of`.
  optional string order_pinned_below = 4 [(buf.validate.field).string.pattern = "^rt_[A-Za-z0-9]+$"];

  // Текстова схема маршруту, напр. "A — авто A1 — ЖД A2 — море — B".
  string scheme = 5;

  // N_tr = кількість плечей − 1.
  uint32 transships = 6 [(buf.validate.field).uint32.lte = 3];

  // Коефіцієнт переваги K (A.6.9).
  double preference_coeff = 7 [(buf.validate.field).double.gte = 0];

  // Повна нормалізована вартість C(R) у БАЗОВІЙ ВАЛЮТІ біржі, не обов'язково в
  // євро. Назва історична і збережена для сумісності з JSON Schema 1.0;
  // фактичний код валюти — `SearchRoutesResponse.base_currency_code` (A.5).
  double total_cost_eur = 8 [(buf.validate.field).double.gte = 0];

  // false — вартість маршруту невідома: маршрут не бере участі в сортуванні за
  // критерієм cost і виводиться в блоці «ціну треба запитати» (A.5).
  bool cost_known = 9;

  // true — вартість узята з медіан link_stats, а не з лота. Супроводжується
  // попередженням estimated_price (A.5, A.7).
  bool estimated_price = 10;

  // Повний час T(R), годин.
  double total_time_h = 11 [(buf.validate.field).double.gte = 0];

  // Підсумковий скор S'(R) ПІСЛЯ штрафів за прапорці. Менший — вищий
  // пріоритет. Полів позиції в контракті немає: позиція в масиві і є рангом.
  double score = 12;

  repeated RouteWarning warnings = 13 [(buf.validate.field).repeated = {
    unique: true
    items: {enum: {defined_only: true}}
  }];

  // 1..4 плечі. max_items = 4 — це max_legs з дроном (A.6.7).
  repeated Leg legs = 14 [(buf.validate.field).repeated = {
    min_items: 1
    max_items: 4
  }];
}

// ---------------------------------------------------------------------------
// Діагностика модуля POST_DRONE (ворота рисунка 3.1.1-7)
// ---------------------------------------------------------------------------

enum DroneReason {
  DRONE_REASON_UNSPECIFIED = 0;

  // Ворота 1 (T16).
  DRONE_REASON_NOT_LAST_AUTO_LEG = 1 [(wire) = "not_last_auto_leg"];

  // Ворота 2 (T17) — зона П2 без дозволу, модуль зупиняється.
  DRONE_REASON_NO_PERMIT = 2 [(wire) = "no_permit"];

  // Ворота 3 (T18).
  DRONE_REASON_OUT_OF_RANGE = 3 [(wire) = "out_of_range"];

  // Ворота 4 (T19).
  DRONE_REASON_CARGO_NOT_ALLOWED = 4 [(wire) = "cargo_not_allowed"];

  // Ворота 5 (T20, T22, T23).
  DRONE_REASON_NO_DRONE_LOT = 5 [(wire) = "no_drone_lot"];
  DRONE_REASON_NO_LANDING_PAD = 6 [(wire) = "no_landing_pad"];
  DRONE_REASON_MAX_LEGS_EXCEEDED = 7 [(wire) = "max_legs_exceeded"];
  DRONE_REASON_EXTRA_LEG_DISABLED = 8 [(wire) = "extra_leg_disabled"];

  // Поза воротами: drone.allow = false (T24).
  DRONE_REASON_DRONE_DISABLED = 9 [(wire) = "drone_disabled"];

  // Поза воротами: перевищення бюджету post_drone_budget_ms (T25, A.11).
  DRONE_REASON_TIMEOUT = 10 [(wire) = "timeout"];
}

message DiagnosticsItem {
  option (buf.validate.message).cel = {
    id: "diagnostics.gate_iff_gate_reason"
    message: "коди воріт 1–5 супроводжуються номером воріт; drone_disabled і timeout — ні"
    expression:
      "(this.reason >= 1 && this.reason <= 8) ? has(this.gate) : !has(this.gate)"
  };

  // Маршрут, для якого виконувалася пост-обробка.
  string parent_route = 1 [(buf.validate.field).string.pattern = "^(rt_[A-Za-z0-9]+)?$"];

  // Номер воріт рисунка 3.1.1-7, 1..6.
  optional uint32 gate = 2 [
    (buf.validate.field).uint32.gte = 1,
    (buf.validate.field).uint32.lte = 6
  ];

  DroneReason reason = 3 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];

  // Вільна деталізація, напр. {"distance_km": 42, "limit_km": 40}.
  google.protobuf.Struct detail = 4;
}

// Обгортка над масивом діагностики.
//
// Це не надлишковий рівень: JSON-контракт вимагає, щоб при diagnostics = false
// поле `drone_diagnostics` було ВІДСУТНІМ, а не порожнім масивом (A.8.4), тоді
// як repeated у proto3 не розрізняє «відсутнє» і «порожнє». Presence message
// зберігає цю різницю; сам масив непорожній (minItems = 1 у схемі).
message DroneDiagnostics {
  repeated DiagnosticsItem items = 1 [(buf.validate.field).repeated.min_items = 1];
}

// Дія, запропонована в drone_cta.
enum DroneCtaAction {
  DRONE_CTA_ACTION_UNSPECIFIED = 0;
  DRONE_CTA_ACTION_CREATE_LOT = 1 [(wire) = "create_lot"];
}

// Випадок «сполучення є, лота немає» — червоний вузол рисунка 3.1.1-7.
message DroneCta {
  message Pad {
    int64 id = 1 [(buf.validate.field).int64.gt = 0];
    string name = 2;
    double distance_to_dest_km = 3 [(buf.validate.field).double.gte = 0];
  }

  message MissingLeg {
    // У схемі допустимі лише A і D.
    TransportMode mode = 1 [(buf.validate.field).enum = {
      defined_only: true
      in: [
        1,
        5
      ]
    }];
    Point from = 2 [(buf.validate.field).required = true];
    Point to = 3 [(buf.validate.field).required = true];
  }

  string parent_route = 1 [(buf.validate.field).string.pattern = "^rt_[A-Za-z0-9]+$"];
  Pad pad = 2 [(buf.validate.field).required = true];
  MissingLeg missing_leg = 3 [(buf.validate.field).required = true];
  DroneCtaAction action = 4 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
}

// ---------------------------------------------------------------------------
// Fallback-класи відповіді (A.3.3, A.6.14, A.6.15)
// ---------------------------------------------------------------------------

// Клас відповіді 2: компанії, що перевозили в напрямку, але їхні заявки
// втратили актуальність.
message CompanyOnDirection {
  Company company = 1;
  string contacts = 2;
  google.protobuf.Timestamp last_lot_at = 3;
  uint32 lots_365d = 4;
  TransportMode mode = 5 [(buf.validate.field).enum.defined_only = true];
}

// Клас відповіді 3: фізично існуюче сполучення без активних заявок
// (джерело — link_stats).
message PossibleLink {
  TransportMode mode = 1 [(buf.validate.field).enum.defined_only = true];
  Point from = 2;
  Point to = 3;
  uint32 companies = 4;
  uint32 lots_total_365d = 5;
  double median_freight_base = 6;
  double median_transit_h = 7;
  google.protobuf.Timestamp last_seen = 8;
}

// ---------------------------------------------------------------------------
// Відповідь (A.8.3, A.8.4)
// ---------------------------------------------------------------------------

// Причина пропуску модуля POST_DRONE. Оголошена enum, а не рядком, попри те що
// схема 1.0 має єдине значення: розширення перерахування є сумісною правкою
// (A.13.6), а рядок без перерахування — ні.
enum DroneSkipped {
  DRONE_SKIPPED_UNSPECIFIED = 0;
  DRONE_SKIPPED_TIMEOUT = 1 [(wire) = "timeout"];
}

// Стан асинхронного пошуку (A.8.3: 2+ перевантаження виконуються асинхронно).
enum SearchState {
  SEARCH_STATE_UNSPECIFIED = 0;
  // Прийнято до виконання, результату ще немає (HTTP-еквівалент 202).
  SEARCH_STATE_ACCEPTED = 1 [(wire) = "accepted"];
  // Проміжна видача: частина гілок уже обійдена.
  SEARCH_STATE_RUNNING = 2 [(wire) = "running"];
  SEARCH_STATE_COMPLETED = 3 [(wire) = "completed"];
  SEARCH_STATE_FAILED = 4 [(wire) = "failed"];
}

message SearchRoutesResponse {
  option (buf.validate.message).cel = {
    id: "response.skipped_implies_partial"
    message: "перевищення бюджету завжди супроводжується partial = true (НФВ A.11)"
    expression: "!has(this.drone_skipped) || this.partial"
  };
  option (buf.validate.message).cel = {
    id: "response.skipped_implies_no_drone_routes"
    message: "при перевищенні бюджету дрон-варіантів у видачі немає (правило 4, A.8.4)"
    expression:
      "!has(this.drone_skipped) || !this.routes.exists(r, r.origin == 2)"
  };
  option (buf.validate.message).cel = {
    id: "response.skipped_implies_no_cta"
    message: "при перевищенні бюджету модуль не встиг оцінити площадки, тому drone_cta не повертається (правило 4, A.8.4)"
    expression: "!has(this.drone_skipped) || !has(this.drone_cta)"
  };
  option (buf.validate.message).cel = {
    id: "response.no_permit_diagnostic_implies_warning"
    message: "код no_permit у діагностиці зобов'язує повернути прапорець no_permit щонайменше в одному маршруті (правило 5, A.8.4)"
    expression:
      "!has(this.drone_diagnostics) || !this.drone_diagnostics.items.exists(d, d.reason == 2) || this.routes.exists(r, r.warnings.exists(w, w == 2))"
  };
  option (buf.validate.message).cel = {
    id: "response.drone_disabled_implies_no_drone_routes"
    message: "при drone.allow = false дрон-варіантів у видачі бути не може (правило 1, A.8.4)"
    expression:
      "!has(this.drone_diagnostics) || !this.drone_diagnostics.items.exists(d, d.reason == 9) || !this.routes.exists(r, r.origin == 2)"
  };
  option (buf.validate.message).cel = {
    id: "response.no_landing_pad_excludes_cta"
    message: "код no_landing_pad означає відсутність придатної площадки, тому drone_cta неприпустиме (T22)"
    expression:
      "!has(this.drone_diagnostics) || !this.drone_diagnostics.items.exists(d, d.reason == 6) || !has(this.drone_cta)"
  };
  option (buf.validate.message).cel = {
    id: "response.normalization_base_has_no_drone_variants"
    message: "база min-max нормалізації не може містити дрон-варіантів (A.7)"
    expression:
      "!this.normalization_base.exists(id, id.endsWith('_d'))"
  };
  option (buf.validate.message).cel = {
    id: "response.normalization_base_nonempty_with_drone"
    message: "за наявності дрон-варіанта база нормалізації не може бути порожньою (A.7)"
    expression:
      "!this.routes.exists(r, r.origin == 2) || this.normalization_base.size() > 0"
  };
  option (buf.validate.message).cel = {
    id: "response.variant_of_points_to_present_route"
    message: "variant_of кожного дрон-варіанта мусить вказувати на присутній у видачі маршрут (правило 1, A.8.4)"
    expression:
      "this.routes.all(r, r.origin != 2 || this.routes.exists(p, p.route_id == r.variant_of))"
  };

  // Ідентифікатор пошуку. Разом зі збереженими параметрами дає відтворювану
  // видачу на тому самому зрізі даних (аудит, A.11).
  string search_id = 1 [(buf.validate.field).string.min_len = 1];

  SearchState state = 2 [(buf.validate.field).enum.defined_only = true];

  // true — частина даних відсутня: недоступне джерело (погода, курси) або
  // перевищений бюджет модуля. Заборонено підставляти вигадані значення
  // (НФВ «чесність даних», A.11).
  bool partial = 3;

  // Заповнене лише при пропуску модуля POST_DRONE. Presence обов'язкове:
  // в JSON-контракті відсутність поля і є нормальним станом.
  optional DroneSkipped drone_skipped = 4;

  // Гілка блок-схеми, що дала результат, напр. "море → жд → авто".
  // Джерело для search_log (A.9, п. 5).
  string branch_reached = 5;

  // Клас відповіді 1. Масив уже у ФІНАЛЬНОМУ порядку ранжування після пасу
  // закріплення (A.7). Позиція в масиві і є рангом; клієнт не перевпорядковує
  // видачу самовільно.
  repeated Route routes = 6;

  // Клас відповіді 2 (A.6.14).
  repeated CompanyOnDirection companies_on_direction = 7;

  // Клас відповіді 3 (A.6.15).
  repeated PossibleLink possible_links = 8;

  // Повертається завжди, коли площадка знайдена, але авто-лота П2′ → П2 немає
  // (правило 5, A.8.4), незалежно від diagnostics.
  optional DroneCta drone_cta = 9;

  // Відсутнє при drone.diagnostics = false (не порожнє) — див. DroneDiagnostics.
  optional DroneDiagnostics drone_diagnostics = 10;

  // Перелік route_id, що увійшли в базу min-max нормалізації (A.7).
  // Дрон-варіанти в базу не входять.
  repeated string normalization_base = 11 [(buf.validate.field).repeated = {
    unique: true
    items: {string: {pattern: "^rt_[A-Za-z0-9]+$"}}
  }];

  // Код базової валюти біржі, у якій виражені `total_cost_eur` і `cost_base`.
  // Одна на всю систему (A.5). Див. розбіжність D-1 у README.
  string base_currency_code = 12 [(buf.validate.field).string.pattern = "^[A-Z]{3,4}$"];

  // Фактичний бюджет, виділений модулю POST_DRONE на цей запит, мс:
  // min(post_drone_budget_ms, post_drone_budget_pct × час пошуку) (A.11).
  // Діагностичне поле для аудиту, не впливає на видачу.
  uint32 post_drone_budget_ms = 13;
}

// Запит результату асинхронного пошуку (A.8.3).
message GetRouteSearchRequest {
  string search_id = 1 [(buf.validate.field).string.min_len = 1];
  SearchContext context = 2;
}

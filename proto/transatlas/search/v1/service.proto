// Модуль SEARCH — межа сервісу.
//
// Це контракт між api-gateway (NestJS/TypeScript) і сервісом search (Go).
// Публічне HTTP/JSON API біржі (A.8) лишається на api-gateway: він відображає
// ці виклики в POST /api/v1/search/* і назад. Модуль search не має власного
// публічного ендпоїнта і не знає про сесії, оплату розділів і ставки.
//
// Межі модуля (A.1.3): у контракті немає ставок, угод, документів, рейтингів
// і платежів. Ендпоїнти дій із результатом (bid-packet, to-multimodal-lot,
// saved searches — A.8.5) належать сервісам exchange і settlement, а не
// SEARCH, тому в цьому файлі їх свідомо немає.

syntax = "proto3";

package transatlas.search.v1;

import "transatlas/search/v1/lots.proto";
import "transatlas/search/v1/routes.proto";

option go_package = "github.com/trans-atlas/search/gen/transatlas/search/v1;searchv1";
option java_multiple_files = true;
option java_package = "net.transatlas.search.v1";

service SearchService {
  // S1–S3: пошук заявок у розділі. Синхронний.
  // НФВ: p95 ≤ 400 мс при 1 млн активних лотів (A.11).
  rpc SearchLots(SearchLotsRequest) returns (SearchLotsResponse);

  // S4–S7: синхронний пошук маршруту. Допустимий для L0 і маршрутів з одним
  // перевантаженням; НФВ p95 ≤ 3 с (A.11).
  //
  // Виклик зобов'язаний мати gRPC deadline: бюджет модуля POST_DRONE
  // обчислюється як min(post_drone_budget_ms, post_drone_budget_pct × бюджет
  // виклику), тому без deadline друга величина невизначена (A.11).
  //
  // Якщо запит вимагає 2+ перевантажень, виклик повертає
  // FAILED_PRECONDITION: такі пошуки виконуються через CreateRouteSearch.
  // Перевищення бюджету POST_DRONE — НЕ помилка: відповідь лишається OK,
  // із partial = true і drone_skipped = TIMEOUT (правило 7, A.8.4).
  rpc SearchRoutes(SearchRoutesRequest) returns (SearchRoutesResponse);

  // S4–S7 асинхронно: 2–3 перевантаження. Еквівалент 202 Accepted.
  // Повертає search_id і state = ACCEPTED, без масиву routes.
  // НФВ: p95 ≤ 15 с до завершення (A.11).
  rpc CreateRouteSearch(SearchRoutesRequest) returns (SearchRoutesResponse);

  // Забрати результат асинхронного пошуку.
  // Повторний виклик на тому самому зрізі даних дає ідентичну видачу — вимога
  // аудиту та ідемпотентності POST_DRONE (A.11).
  rpc GetRouteSearch(GetRouteSearchRequest) returns (SearchRoutesResponse);

  // Проміжна видача перших знайдених маршрутів (A.11: «асинхронно, з
  // проміжною видачею»). Кожне повідомлення — повний знімок відповіді у
  // фінальному на цей момент порядку ранжування, а не дельта: клієнт
  // замінює список, а не доклеює елементи, інакше пас закріплення (A.7)
  // на клієнті порушиться.
  //
  // Останнє повідомлення має state = COMPLETED або FAILED.
  rpc WatchRouteSearch(GetRouteSearchRequest) returns (stream SearchRoutesResponse);

  // Автодоповнення пункту з автопідтягуванням країни та регіону (A.8.5).
  rpc SuggestPoints(SuggestPointsRequest) returns (SuggestPointsResponse);

  // Калькулятор відстані та орієнтовної вартості за медіанами link_stats
  // (A.8.5).
  rpc EstimateRoute(EstimateRouteRequest) returns (EstimateRouteResponse);
}
